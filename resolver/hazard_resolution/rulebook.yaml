# ---------------------------------------------------------------------------
# RULEBOOK — the single human-readable source of truth for how the hazard
# resolution machine behaves.
#
# Every threshold, precedence order and policy switch the machine uses lives
# in this file. Code reads these values at runtime via
# resolver.hazard_resolution.rulebook.load_rulebook(); nothing here may be
# duplicated as a hard-coded constant in Python. Changing a value here
# changes the machine's behaviour on the next run — no code change needed.
#
# Never put credentials in this file. API keys come from environment
# variables only (EMDAT_API_KEY, IDMC_API_KEY, RELIEFWEB_APPNAME, IPC key);
# the loader rejects any key that looks like a secret.
# ---------------------------------------------------------------------------

cyclone:
  # A storm track qualifies for a country-month when it passes within
  # buffer_km of the country at or above min_wind_kt (34 kt = tropical-storm
  # strength, the standard gale-force threshold).
  buffer_km: 200
  min_wind_kt: 34
  # Which IBTrACS wind column to trust, in order (first non-null wins).
  # usa_wind = 1-minute sustained (USA agencies); wmo_wind = the WMO
  # reporting agency's value (often 10-minute sustained).
  wind_source_priority: [usa_wind, wmo_wind]
  ibtracs:
    # NOAA NCEI IBTrACS v04r01 CSV endpoints. {scope} is one of
    # "last3years" (rolling, provisional current season) or "ALL"
    # (full archive, for backcast).
    url_template: "https://www.ncei.noaa.gov/data/international-best-track-archive-for-climate-stewardship-ibtracs/v04r01/access/csv/ibtracs.{scope}.list.v04r01.csv"
    default_scope: last3years
    request_timeout_sec: 300
    # Zeros are only written when IBTrACS demonstrably covers the target
    # month: the newest track point in the store must be no earlier than
    # month_end - coverage_grace_days.  Months inside ingestion gaps stay
    # unresolved instead of becoming false zeros.
    coverage_grace_days: 7
  reliefweb_sweep:
    # Silence check for non-triggered country-months.  Query 1 filters on
    # the ReliefWeb disaster-type taxonomy; query 2 (only when query 1 is
    # silent) does a full-text keyword search.
    disaster_types: ["Tropical Cyclone"]
    keywords: ["cyclone", "hurricane", "typhoon", "tropical storm"]
    # Sweep window: month start .. month end + publication_pad_days
    # (reports about a late-month landfall publish into the next month).
    publication_pad_days: 14
    # A sweep is "silent" when total hits <= max_hits_for_silence.
    max_hits_for_silence: 0
    # How many hit titles/URLs to keep as evidence.
    sample_size: 5
    request_timeout_sec: 30
    request_delay_sec: 0.5

flood:
  # GDACS alert colour that counts as a detected flood. Ordering is
  # green < orange < red; the configured level and anything above it trigger.
  gdacs_trigger_level: orange

drought:
  # Drought skips the impact ladder and resolves against IPC data.
  # The exact rule is specified in Phase 4 of the build; the threshold keys
  # below are placeholders — loaded and validated, but not yet consumed by
  # any resolution code.
  rule: ipc_phase3plus_delta
  ipc_phase_threshold: 3      # placeholder — IPC phase whose population the rule reads
  min_delta_people: 0         # placeholder — absolute Phase 3+ increase to count as drought impact
  min_delta_pct: 0.0          # placeholder — relative Phase 3+ increase to count as drought impact

# Resolutions freeze at month-end + freeze_days and are never reopened.
# Later revisions are logged to haz_revisions but do not alter resolved values.
freeze_days: 60

# Impact precedence ladder, highest rung first. When a hazard is detected,
# the machine takes the people-affected figure from the highest rung that
# has one. GDACS is deliberately absent: it is detection + ceiling only.
ladder:
  - emdat
  - reliefweb_extracted
  - ifrc_go
  - idmc_idu

sanity:
  # No accepted figure may exceed ceiling_multiplier x the GDACS exposed
  # population for the event, nor (when population_cap is true) the national
  # population. GDACS exposure is a ceiling, never a resolution value.
  ceiling_source: gdacs_exposed
  ceiling_multiplier: 1.0
  population_cap: true

# In conflict-affected settings the ladder still decides the number, but the
# resolution row is flagged for review.
conflict_rule: ladder_with_flag

# First calendar year included when computing severity base rates
# (haz_base_rates_severity quantiles).
severity_base_rate_window_start: 2015

# How far back detection/resolution is backcast per hazard (first year).
backcast:
  cyclone: 2000
  flood: 2010
  drought: 2017

reliefweb:
  # Public ReliefWeb API base URL (free; the required appname parameter
  # comes from the RELIEFWEB_APPNAME environment variable).
  api_base_url: "https://api.reliefweb.int/v2"
