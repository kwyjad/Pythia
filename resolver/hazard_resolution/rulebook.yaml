# ---------------------------------------------------------------------------
# RULEBOOK — the single human-readable source of truth for how the hazard
# resolution machine behaves.
#
# Every threshold, precedence order and policy switch the machine uses lives
# in this file. Code reads these values at runtime via
# resolver.hazard_resolution.rulebook.load_rulebook(); nothing here may be
# duplicated as a hard-coded constant in Python. Changing a value here
# changes the machine's behaviour on the next run — no code change needed.
#
# Never put credentials in this file. API keys come from environment
# variables only (EMDAT_API_KEY, IDMC_API_KEY, RELIEFWEB_APPNAME, IPC key);
# the loader rejects any key that looks like a secret.
# ---------------------------------------------------------------------------

cyclone:
  # A storm track qualifies for a country-month when it passes within
  # buffer_km of the country at or above min_wind_kt (34 kt = tropical-storm
  # strength, the standard gale-force threshold).
  buffer_km: 200
  min_wind_kt: 34
  # Which IBTrACS wind column to trust, in order (first non-null wins).
  # usa_wind = 1-minute sustained (USA agencies); wmo_wind = the WMO
  # reporting agency's value (often 10-minute sustained).
  wind_source_priority: [usa_wind, wmo_wind]
  ibtracs:
    # NOAA NCEI IBTrACS v04r01 CSV endpoints. {scope} is one of
    # "last3years" (rolling, provisional current season) or "ALL"
    # (full archive, for backcast).
    url_template: "https://www.ncei.noaa.gov/data/international-best-track-archive-for-climate-stewardship-ibtracs/v04r01/access/csv/ibtracs.{scope}.list.v04r01.csv"
    default_scope: last3years
    request_timeout_sec: 300
    # Zeros are only written when IBTrACS demonstrably covers the target
    # month: the newest track point in the store must be no earlier than
    # month_end - coverage_grace_days.  Months inside ingestion gaps stay
    # unresolved instead of becoming false zeros.
    coverage_grace_days: 7
  reliefweb_sweep:
    # Silence check for non-triggered country-months.  Query 1 filters on
    # the ReliefWeb disaster-type taxonomy; query 2 (only when query 1 is
    # silent) does a full-text keyword search.
    disaster_types: ["Tropical Cyclone"]
    keywords: ["cyclone", "hurricane", "typhoon", "tropical storm"]
    # Sweep window: month start .. month end + publication_pad_days
    # (reports about a late-month landfall publish into the next month).
    publication_pad_days: 14
    # A sweep is "silent" when total hits <= max_hits_for_silence.
    max_hits_for_silence: 0
    # How many hit titles/URLs to keep as evidence.
    sample_size: 5
    request_timeout_sec: 30
    request_delay_sec: 0.5

flood:
  # GDACS alert colour that counts as a detected flood. Ordering is
  # green < orange < red; the configured level and anything above it trigger.
  gdacs_trigger_level: orange
  gdacs:
    # NOTE ON ENDPOINTS: the GDACS HTTP endpoints are deliberately NOT
    # repeated here. Event discovery and per-event enrichment reuse
    # resolver/connectors/gdacs.py, which owns those URLs; duplicating
    # them into the rulebook would create two sources of truth for one
    # address. What the rulebook owns is how the machine USES that
    # connector — window, pacing, and the zero-safety coverage gate.
    request_delay_sec: 1.0
    enrich_workers: 6
    # How many months of GDACS events to pull around the target month.
    # Events are discovered over [month_start - lookback, month_end +
    # lookahead] so a long-running flood that began earlier still lands
    # in the store for its start-month attribution.
    lookback_months: 3
    lookahead_months: 1
    # Zeros are only written when GDACS demonstrably covers the target
    # month: the newest stored event must reach month_end -
    # coverage_grace_days. An ingestion gap must never read as a quiet
    # month (same principle as cyclone.ibtracs.coverage_grace_days).
    coverage_grace_days: 7
  reliefweb_sweep:
    # Silence check for non-triggered flood country-months. Same two-query
    # shape as the cyclone sweep — taxonomy filter, then keywords.
    disaster_types: ["Flood", "Flash Flood"]
    keywords: ["flood", "flooding", "flash flood", "inundation", "landslide"]
    publication_pad_days: 14
    max_hits_for_silence: 0
    sample_size: 5
    request_timeout_sec: 30
    request_delay_sec: 0.5

drought:
  # Drought skips the impact ladder — there is no discrete event to walk
  # rungs for — and resolves against IPC/CH food-security analyses:
  #
  #   people affected(country, month)
  #       = max(0, Phase3+(analysis covering the month)
  #                - Phase3+(previous current-period analysis))
  #
  # admitted as DROUGHT impact only when the indicators below show drought
  # conditions. IPC's structured feeds state Phase 3+ population but not its
  # DRIVER (drought vs conflict vs economic shock) — that lives in narrative
  # PDFs — so the indicators are what attributes a deterioration to drought.
  # Without them the machine would file conflict-driven food insecurity as
  # drought impact.
  rule: ipc_phase3plus_delta

  # The IPC phase whose population the rule reads. 3 = "Crisis or worse",
  # i.e. the Phase 3+ aggregate every IPC/CH product publishes.
  ipc_phase_threshold: 3

  # How large an increase counts as drought impact. min_delta_pct is a
  # PERCENTAGE of the previous analysis's Phase 3+ population. At 0/0.0 any
  # increase counts; raise either to require a material deterioration.
  # A qualifying increase resolves to a value; a non-qualifying one resolves
  # to a credible ZERO (the analyses were read, and they state no increase).
  min_delta_people: 0
  min_delta_pct: 0.0

  # WHICH MONTHS a delta resolves.
  #
  # An IPC current-period analysis is valid over several months but states
  # ONE Phase 3+ figure, so the delta carries no monthly breakdown and the
  # machine is not allowed to invent one.
  #
  #   analysis_window — every month the analysis window covers resolves to
  #                     the delta. The newly-Phase-3+ population is treated
  #                     as persisting through the window the analysis
  #                     declares it for, which is what a slow-onset hazard
  #                     does.
  #   start_month     — only the window's first month carries the delta; the
  #                     remaining covered months resolve to zero ("the
  #                     analysis covering this month reported no NEW
  #                     deterioration"), mirroring event_attribution.figure.
  #
  # WARNING, analysis_window: the same people appear in every month of a
  # window. These values answer "how many people were affected by drought
  # IN this month" — a stock — and must never be SUMMED across months.
  month_attribution: analysis_window

  ipc:
    # IPC public API. Auth is the IPC_API_KEY environment variable, sent as
    # the documented `key=` query parameter — never stored here.
    api_url: "https://api.ipcinfo.org/population"
    request_timeout_sec: 120
    # IPC publishes sparsely (one to three analyses a year per country), so
    # the window has to be wide enough to contain the PREVIOUS analysis as
    # well as the covering one — the rule is a difference, and with no
    # baseline there is no answer.
    lookback_months: 36
    lookahead_months: 6
    # Second acquisition path: the Phase 3+ rows the repo's existing FEWS NET
    # and IPC connectors already write to facts_resolved. It needs no key and
    # covers the FEWS NET countries the IPC API connector deliberately
    # excludes, so the drought path still works where those countries are
    # monitored. Analyses found by both paths are deduplicated by window,
    # preferring the source listed first in source_priority.
    use_facts_resolved: true
    facts_resolved_metric: phase3plus_in_need
    facts_resolved_publishers: ["IPC", "FEWS NET"]
    source_priority: [ipc_api, facts_resolved]

  # ---------------------------------------------------------------------
  # DROUGHT INDICATORS — the attribution gate, and the gate in front of
  # every drought zero.
  #
  # Each entry is fetched once per run as a global feed and cached in
  # haz_raw_drought_indicators as VALUES, not verdicts: the thresholds below
  # are applied at evaluation time, so changing them changes behaviour
  # without a re-fetch.
  #
  # An entry with an empty url is not consulted. An entry that cannot be
  # read is UNAVAILABLE — and an unavailable REQUIRED indicator suppresses
  # zeros for that month, because "we could not check" and "there was no
  # drought" are different facts and only the second can justify a zero.
  # ---------------------------------------------------------------------
  indicators:
    # any = one indicator showing drought is enough; all = every consulted
    # indicator must agree before the month counts as drought.
    combine: any
    # How stale a feed observation may be and still speak for a month. Feeds
    # that publish a "latest" snapshot with no date are stamped with their
    # retrieval month, so backcast months fall outside this window and
    # correctly resolve to nothing rather than to a false zero. Point an
    # entry's url at a per-month archive (it may contain {ym}, {year} and
    # {month}) to backcast properly.
    max_observation_age_months: 1

    # How many entries must have ANSWERED before a verdict is possible.
    #
    # Until Sept 2026 the only protection against a total outage was that one
    # entry carried required: true — and that entry was ASAP, so one dead URL
    # made every drought cell in the run INCONCLUSIVE (756 of them). Naming a
    # different indicator as the required one just relocates that failure.
    # What the gate actually needs is SOME independent physical evidence, not
    # one nominated feed, and that is what this counts.
    #
    # It must stay >= 1: at zero, an outage in every feed would read as "no
    # drought anywhere" and the machine would zero the whole world.
    min_available: 1

    # How many indicators must have carried a reading for THE COUNTRY ITSELF
    # before a zero may rest on evidence of absence. An alerting feed answers
    # for every country it does not list, so min_available alone is
    # satisfied by one feed that has never monitored the country: with HDX
    # Signals covering a few dozen countries, that would have zeroed every
    # country outside its watch list on the strength of not being watched.
    # A country no feed has a reading for is "not looked at", never "quiet"
    # — it resolves INCONCLUSIVE (no row) with reason indicator_no_coverage.
    # 0 restores the pre-Sept-2026 behaviour.
    min_present_readings: 1

    # How many indicator feeds must have ANSWERED (drought or no drought)
    # before a zero may rest on their silence. In September 2026 two of the
    # three feeds were dead (ASAP 404, NMME unread) and the survivor zeroed
    # 159 countries a month on its own. A zero from one of three feeds is
    # not evidence of quiet: below this floor the cell is INCONCLUSIVE (no
    # row, reason indicator_too_few_feeds_for_zero) and any provisional
    # zero an earlier run wrote on thinner evidence is retracted. A measured
    # zero (both IPC analyses read, no increase) rests on IPC and is exempt.
    # 1 restores the pre-Sept-2026 behaviour.
    min_answered_for_zero: 2
    entries:
      # JRC ASAP agricultural hotspot classification. Free, no key,
      # country-level. Absence from the feed means "no warning issued",
      # which is what makes it usable as evidence of absence.
      # --- The JRC ASAP hotspot assessment, as a monthly time series. ---
      # The warnings endpoint the entry below was written against vanished
      # in August 2026 (all three candidate routes 404 on every month).
      # What JRC still publishes is the hotspot ASSESSMENT: one CSV holding
      # every monthly assessment since October 2016, for the ~80 food
      # insecure countries it monitors, as files/hotspots_ts.zip (HDX
      # mirrors it as the asap-hotspots-monthly dataset, which the third
      # candidate reaches through the CKAN API rather than a guessed path).
      # Columns as HDX Signals reads them: asap0_id (a JRC unit id),
      # date, hs_code / hs_name (0 no hotspot, 1 hotspot, 2 major hotspot,
      # 3 not assessed), comment. The parser resolves the country from an
      # iso3 column or a country name where the file carries one; a file
      # carrying only asap0_id resolves 0 of N records and is REFUSED with
      # the columns named, never cached as "no drought anywhere".
      #
      # Because every record carries its date, the file is parsed into one
      # snapshot per month: a backcast month reads the assessment made for
      # it. This is what lets the drought backcast reach 2016.
      #
      # Absence means UNKNOWN: ASAP assesses ~80 countries, so a country it
      # does not list was not looked at, not found quiet. "Not assessed"
      # (hs_code 3) is likewise no reading at all.
      - name: asap_hotspots
        provider: asap
        time_series: true
        urls:
          - "https://agricultural-production-hotspots.ec.europa.eu/files/hotspots_ts.zip"
          - "https://agricultural-production-hotspots.ec.europa.eu/files/hotspots_html_ts.zip"
          - "hdx-ckan://asap-hotspots-monthly"
        url: ""
        required: false
        request_timeout_sec: 120
        match: classes
        absence_means_no_drought: false
        drought_classes: ["1", "2", "hotspot", "major hotspot"]
        unassessed_classes: ["3", "not assessed"]

      # The legacy warnings feed. Dormant since Sept 2026: no url, so it is
      # never consulted, but the entry stays so the snapshots it cached
      # while it worked still evaluate under the classes it published.
      # Restore a url here only if JRC publishes the warnings again.
      - name: asap
        provider: asap
        urls: []
        url: ""
        # Downgraded from required: true in Sept 2026. It was the ONLY
        # required indicator, so a single dead URL made every drought cell in
        # the run INCONCLUSIVE — 756 of them. Nothing is required now;
        # min_available above asks for independent evidence without naming
        # which feed must supply it.
        required: false
        request_timeout_sec: 60
        # Classes that count as drought conditions, matched
        # case-insensitively against whatever the feed states (ASAP has used
        # both numeric levels and words across versions).
        drought_classes: ["2", "3", "4", "warning", "alarm", "drought"]

      # --- Indicators read from tables this repo already ingests. ---
      # No new request, no new credential, and no new failure mode: if the
      # monthly ingest ran, the evidence is already in the DB the machine is
      # holding.
      #
      # HDX Signals is OCHA's automated crisis monitoring, and its
      # jrc_agricultural_hotspots indicator IS ASAP — the same underlying
      # signal, reached through a connector with its own retries, its own
      # CKAN fallback and its own tests. Like ASAP it is an ALERTING feed
      # (it publishes signals, not a global status), so a country's absence
      # is the statement that no signal was issued.
      - name: hdx_agricultural_stress
        provider: pythia_table
        table: hdx_signals
        url: ""
        required: false
        request_timeout_sec: 60
        iso3_column: iso3
        value_column: concern_level
        date_column: signal_date
        # HDX signals are published on their own cadence and a country is not
        # re-signalled every month; three months keeps a live warning in view
        # without letting last year's speak for this month.
        lookback_months: 3
        # jrc_agricultural_hotspots ONLY. The entry shipped in early Sept
        # 2026 also admitted ipc_food_insecurity and wfp_market_monitor —
        # the first is the very quantity the drought rule differences (the
        # circularity the comment below refuses), and the second is a price
        # signal, not a physical one. With three indicators sharing a
        # country-month the pick between them was also arbitrary.
        where: "indicator = 'jrc_agricultural_hotspots'"
        match: classes
        absence_means_no_drought: true
        drought_classes: ["high concern", "high", "medium concern", "medium", "alarm", "warning"]

      # NMME country-mean precipitation anomaly, in sigma units, already
      # ingested monthly into seasonal_forecasts. Supporting evidence, never
      # a primary gate: this is a FORECAST for the month rather than an
      # observation of it, which is why it is required: false. A country
      # absent from NMME is unknown, not dry.
      - name: nmme_precip_anomaly
        provider: pythia_table
        table: seasonal_forecasts
        url: ""
        required: false
        request_timeout_sec: 60
        iso3_column: iso3
        value_column: anomaly_value
        date_column: forecast_issue_date
        # NMME leads are 1-based and a forecast issued in month M at lead L
        # is ABOUT month M+L. The observation month is therefore the issue
        # month shifted by the lead, so the gate for month T reads the lead-1
        # forecast issued in T-1 rather than the one issued in T about T+1.
        date_offset_column: lead_months
        lookback_months: 0
        # Every vintage that speaks for the month is a candidate and the
        # shortest lead (the most recent issue) wins — pinning lead_months
        # here meant a month whose lead-1 vintage was not in the table read
        # as "no usable rows" while other vintages about it were.
        where: "variable = 'prate'"
        match: threshold
        absence_means_no_drought: false
        # NOT -0.43. That is NMME's below-normal TERCILE boundary, which by
        # construction covers a third of countries in any month — under
        # combine: any it would attribute a third of the world's food
        # insecurity to drought, which is precisely the conflict-driven
        # deterioration this gate exists to keep out. -1.0 sigma is roughly
        # the driest sixth of the distribution: a statement that conditions
        # are dry, rather than a statement that they are on the dry side.
        threshold: -1.0
        direction: below

      # NOT offered, deliberately: FEWS NET / IPC Phase 3+. That is the very
      # quantity the drought rule differences, so admitting it here would
      # reduce the attribution gate to "IPC rose, therefore drought, because
      # IPC rose" — and filing conflict-driven food insecurity as drought is
      # the exact failure the gate exists to prevent.
      # Country-aggregated rainfall / water-balance anomaly feeds. CHIRPS and
      # SPEI are gridded rasters; turning them into a country number needs
      # zonal statistics, which does not belong in the resolution path. The
      # tabular provider instead reads a pre-computed (iso3, ym, value) feed
      # — CSV or JSON — so a maintainer can point it at whatever
      # country-level anomaly product they already produce.
      #
      # Unlike ASAP, a country ABSENT from an anomaly feed is unknown, not
      # dry: these entries are required: false so their absence cannot
      # suppress zeros everywhere.
      - name: chirps_spi3
        provider: tabular
        url: ""
        required: false
        request_timeout_sec: 60
        threshold: -1.0
        direction: below
      - name: spei3
        provider: tabular
        url: ""
        required: false
        request_timeout_sec: 60
        threshold: -1.0
        direction: below

# Resolutions freeze at month-end + freeze_days and are never reopened.
# Later revisions are logged to haz_revisions but do not alter resolved values.
# Before the deadline the machine still writes its answer, marked
# provisional (haz_resolutions.provisional = TRUE); on or after it the row
# is written final and becomes immutable.
freeze_days: 60

# EVENT-TO-MONTH ATTRIBUTION.
# A source event carries a date RANGE, and a reported figure describes the
# whole event, not a month of it. Two separate decisions:
#
#   detection  — an event is DETECTED in every month its range overlaps,
#                so a flood running 28 Jan .. 4 Feb triggers both months.
#   attribution — its people-affected FIGURE is attributed WHOLLY to the
#                START month. Figures are never split across months:
#                splitting would invent a monthly breakdown no source
#                stated, which the machine is not allowed to do. The full
#                span is recorded in provenance (event_span) so a reader
#                can see the figure covers more than the month it sits in.
event_attribution:
  detection: overlap        # every overlapped month detects the event
  figure: start_month       # the figure lands wholly in the start month

# Impact precedence ladder, highest rung first. When a hazard is detected,
# the machine takes the people-affected figure from the highest rung that
# has one. GDACS is deliberately absent: it is detection + ceiling only.
ladder:
  - emdat
  - reliefweb_extracted
  - ifrc_go
  - idmc_idu

# Rungs whose figures are DISPLACEMENT, not people-affected. These resolve
# as a lower bound: the value stands, and both the provenance and the
# rule_fired say so, because displacement counts a strict subset of the
# people a hazard affects.
lower_bound_rungs:
  - idmc_idu

sanity:
  # No accepted figure may exceed ceiling_multiplier x the GDACS exposed
  # population for the event, nor (when population_cap is true) the national
  # population. GDACS exposure is a ceiling, never a resolution value.
  ceiling_source: gdacs_exposed

  # Raised 1.0 -> 3.0 in Sept 2026. At 1.0 there was NO room between a
  # modelled estimate and a reported one, so any reported figure above the
  # model was rejected — and reported impact routinely exceeds modelled
  # exposure for good reasons: the footprint is a hazard envelope rather
  # than an impact assessment, gridded population is coarse, and "affected"
  # counts people beyond those inside the envelope (displaced, cut off,
  # dependent on a destroyed service). The ceiling exists to catch a
  # mis-transcription — a figure ten times exposure — not to hold reports to
  # a model's arithmetic. It still flags rather than rewrites: conflict_rule
  # is ladder_with_flag, and a breach is recorded on the row either way.
  ceiling_multiplier: 3.0

  # A GDACS exposure BELOW this many people is a parse failure, not a bound,
  # and means UNKNOWN exactly as a zero does (Sept 2026). The figures ledger
  # of run 33841370196 carried three distinct ceilings across 310 rows: 5,
  # 20 and 955 — exposures of 1.67, 6.67 and 318 people for national
  # monthly flood totals — and 72 well-sourced figures were rejected against
  # them. No national monthly flood or cyclone exposure GDACS would alert on
  # is smaller than this; below it, the population-share fallback and the
  # national cap are the bounds in force.
  min_plausible_exposure: 1000

  population_cap: true

  # When GDACS says nothing about exposure — its discovery response carries
  # no population figure, and the per-event RSS fetch that fills it in
  # tolerates 404s — a share of the national population stands in as the
  # ceiling. Without it a silent GDACS meant NO ceiling at all, so the only
  # remaining bound was the whole national population.
  #
  # A hazard cannot plausibly affect this share of a country in one month
  # without being the largest disaster in its history; above it, a
  # mis-transcribed figure is the likelier reading. Set to 0 to disable the
  # fallback and rely on the population cap alone.
  population_fallback_share: 0.5

# When rungs disagree wildly the ladder still decides the number, but the
# row is flagged for human review. "Wildly" is defined, not judged:
#
#   * the ladder's chosen figure exceeds the sanity ceiling, OR
#   * figures on ADJACENT populated rungs differ by more than
#     order_of_magnitude_factor.
#
# ladder_with_flag = keep the ladder's answer, set flagged = TRUE. The
# machine never silently substitutes a different rung's number.
conflict_rule: ladder_with_flag
conflict_detection:
  order_of_magnitude_factor: 10.0

# First calendar year included when computing severity base rates
# (haz_base_rates_severity quantiles).
severity_base_rate_window_start: 2015

# How far back detection/resolution is backcast per hazard (first year).
# Each hazard's depth is set by when its DETECTOR's record begins, not by
# preference: IBTrACS best tracks are usable from well before 2000, GDACS
# alerts only stabilise around 2010, and IPC's structured Phase 3+ feeds
# start later still. Backcasting past a detector's coverage would not
# produce zeros — the coverage gate suppresses them — it would produce a
# long run of empty months that flatter nothing and cost real time.
backcast:
  cyclone: 2000
  flood: 2010
  drought: 2017

# ---------------------------------------------------------------------------
# RAW CACHE RETENTION (haz_raw_*).
#
# These caches were append-only in practice until 2026-09-01: a wall clock
# inside the hashed payload defeated the content-hash dedup, so every run
# appended a full duplicate of every record it touched. The canonical DB grew
# from 3.0 GB to 17.7 GB in 26 nights and the release publish aborted.
#
# The hash is fixed, so a second row now means a genuine upstream revision --
# and load_raw_records only ever reads the newest. An audit trail of upstream
# revisions belongs in haz_revisions, not in an unbounded body cache
# (reliefweb_docs alone caches up to 30 docs x 24,000 chars per cell).
# ---------------------------------------------------------------------------
raw_cache:
  # Rows kept per (record_id, iso3, ym, hazard). NOT per record_id: the same
  # ReliefWeb document is legitimately cached once per cell it was fetched
  # for, and collapsing on the document id alone would delete other cells'
  # documents. See resolver/hazard_resolution/retention.py.
  keep_revisions_per_record: 1
  compaction:
    # Rewrite the file when it exceeds this multiple of the bytes its live
    # rows need. DuckDB reuses freed blocks but never truncates, so removing
    # rows stops growth without returning any space -- only a copy reclaims.
    file_bloat_ratio: 1.5

# ---------------------------------------------------------------------------
# BASE RATES computed from the backcast (haz_base_rates_*).
# ---------------------------------------------------------------------------
base_rates:
  occurrence:
    # A (country, hazard, calendar month) cell needs this many backcast
    # years of trigger evidence before an occurrence rate is published. One
    # or two Novembers is not a base rate, and a p_occurrence of 1.0 from a
    # single observed year would be read as certainty.
    min_years: 3
  severity:
    # Severity quantiles are published from this many resolved values up.
    # Kept at 1 deliberately: n_events travels with every row, so a thin
    # distribution is visible to its consumer rather than absent. Raise it
    # to suppress thin rows instead of labelling them.
    min_events: 1

  # -------------------------------------------------------------------------
  # THE PROMPT BLOCK — what a forecaster is actually shown (Phase 6).
  #
  # The base rates above are also injected into the SPD prompt of every PA
  # question the machine resolves, so the forecaster reasons against the
  # generating process it will be scored by. Rendering is generated from
  # this file at prompt-build time, so a threshold change here moves the
  # prompt text with no code change — the prompt and the rulebook cannot
  # drift apart.
  # -------------------------------------------------------------------------
  prompt:
    # How many resolved events a country needs before its severity
    # QUANTILES are rendered. This is deliberately stricter than
    # severity.min_events (1), which governs what is STORED: a stored row
    # carries n_events beside its quantiles, so an analyst can see the
    # distribution is thin. A prompt has no such margin — five quantiles
    # read as a distribution whatever the header says, and anchoring a
    # forecast on the spread of two events is worse than anchoring on
    # nothing. Below this the block states the event count instead.
    min_events_for_quantiles: 3
    # Declared size budget for the rendered block, in characters
    # (roughly 4 characters per token, so 1200 is ~300 tokens; the shipped
    # blocks render at 800-1000, which is the headroom this leaves).
    # Exceeding it is LOGGED and fails a test; it is never silently
    # truncated. A base rate cut off mid-table is a worse prompt than a
    # long one, and a silent truncation is invisible in the artifact.
    max_chars: 1200

# ---------------------------------------------------------------------------
# DARTMOUTH FLOOD OBSERVATORY — CALIBRATION CROSS-CHECK ONLY.
#
# The DFO Global Active Archive of Large Flood Events is an independent,
# manually curated record of large floods reaching back to 1985 — well
# before GDACS, which is why the flood backcast starts at 2010.
#
# It is used for exactly one thing: asking whether the flood occurrence
# rates the machine derives from its GDACS-era backcast look like the
# occurrence rates an independent archive records for the years BEFORE
# that era. A country whose DFO rate is far above the machine's rate is a
# country where flood detection is probably missing events.
#
# It is NEVER a trigger and NEVER a resolution value. dfo.py writes only
# to haz_raw_dfo and the acceptance report; a test asserts it touches
# neither haz_triggers nor haz_impact_candidates nor haz_resolutions.
# Keeping the comparison window strictly before the backcast era is what
# makes it a cross-check rather than a circular self-confirmation.
# ---------------------------------------------------------------------------
dfo:
  enabled: true
  # NOTE: this endpoint could not be reached from the environment the
  # module was built in. A wrong URL or a changed shape fails LOUD and
  # SAFE — the fetch reports unavailable, the cross-check section of the
  # report says so, and nothing else in the machine is affected, because
  # nothing else reads this source.
  url: "https://floodobservatory.colorado.edu/temp/FloodArchive.xlsx"
  # How to parse what the URL returns: xlsx or csv.
  format: xlsx
  request_timeout_sec: 300
  # Compare against DFO floods strictly BEFORE this year. It matches
  # backcast.flood so the two windows do not overlap; a comparison against
  # the same years the machine already resolved would confirm nothing.
  cross_check_end_year: 2010
  # Country-months need this many DFO years before their rate is compared.
  min_years_for_comparison: 5
  # Flag a country when its machine-era occurrence rate differs from the
  # DFO-era rate by more than this factor in either direction. This is a
  # REPORTING threshold — it flags a country for a human to look at and
  # changes no resolution.
  divergence_factor: 3.0

reliefweb:
  # Public ReliefWeb API base URL (free; the required appname parameter
  # comes from the RELIEFWEB_APPNAME environment variable).
  api_base_url: "https://api.reliefweb.int/v2"

  # -------------------------------------------------------------------------
  # DOCUMENT SELECTION for ladder rung 2 (LLM-extracted figures).
  #
  # Documents are only fetched for TRIGGERED country-months. Extraction is
  # the machine's only paid step, and a non-triggered month has already
  # resolved (to zero, or to nothing) before this code is reached.
  # -------------------------------------------------------------------------
  documents:
    # ReliefWeb content formats worth reading for a stated figure. "Flash
    # Update" is not a format of its own — ReliefWeb files flash updates
    # under Situation Report, and government statements under News and
    # Press Release.
    formats: ["Situation Report", "News and Press Release", "Assessment", "UN Document"]
    # How many documents are read per country-month. This is the per-cell
    # extraction call count, so it is the first lever to pull if
    # extraction.max_calls_per_month starts binding.
    max_docs_per_cell: 30
    # How many documents to ask the API for before ranking. Ranking is done
    # over this pool and the top max_docs_per_cell are read, so the pool
    # must be comfortably larger than the cap or "most authoritative first"
    # degenerates into "most recent first".
    candidate_pool_size: 100
    # A document may supply a figure to a cell only if it is ABOUT that
    # country and that window (Sept 2026). ReliefWeb files a regional
    # round-up under every country it mentions, and the API's country.iso3
    # filter matches any of them: two Spanish- and English-language
    # accounts of March-to-May floods affecting 82,000 people were filed
    # under AFG / FL / 2026-07, and only failed to land because the broken
    # ceiling rejected them. require_primary_country demands the document's
    # primary_country be the cell's; enforce_reporting_window demands the
    # date a figure is about (its own date, else the source's publication
    # date, else ReliefWeb's) fall inside month start .. month end +
    # publication_pad_days. A figure with no parseable date at all is kept.
    require_primary_country: true
    enforce_reporting_window: true
    # Publication window: month start .. month end + publication_pad_days
    # (a report about a late-month flood publishes into the next month).
    publication_pad_days: 14
    # Document ranking for selection, best first. Each entry is matched
    # case-insensitively against the document's source shortnames, source
    # names and ReliefWeb source-type names; the first entry that matches
    # gives the document its rank, and an unmatched document ranks after
    # every listed one. Ties break on recency, then document id, so the
    # selection is stable across runs.
    source_priority:
      - "OCHA"
      - "Government"
      - "United Nations"
      - "International Organization"
      - "Red Cross"
      - "Non-governmental Organization"
    # How much of a document body is sent to the extractor. Figures are
    # stated in the first screens of a situation report, and the quote
    # verifier only accepts a quote found in the text actually sent — so a
    # truncated body cannot produce an unverifiable figure.
    body_char_limit: 24000
    request_timeout_sec: 60
    request_delay_sec: 0.5

  # -------------------------------------------------------------------------
  # FIGURE PRECEDENCE (deterministic post-processing, no LLM).
  #
  # The extractor reports who a document ATTRIBUTES each figure to
  # (stated_by, verbatim). This maps that free text onto a precedence order:
  # government > UN agency > IFRC/NGO > media. Matching is a lowercase
  # substring test against the keywords, first tier that matches wins, and
  # an unrecognised attribution ranks after every listed tier (it is not
  # discarded — an unattributed figure in an OCHA sitrep is still evidence).
  # -------------------------------------------------------------------------
  authority_precedence:
    - tier: government
      keywords: ["government", "ministry", "ministry of", "national disaster",
                 "disaster management authority", "civil protection", "civil defence",
                 "state authorities", "provincial", "district administration",
                 "ndma", "ndrrmc", "bnpb", "nema", "dmha"]
    - tier: un_agency
      keywords: ["ocha", "united nations", "unicef", "undp", "unhcr", "unfpa",
                 "wfp", "who", "fao", "iom", "unrwa", "un "]
    - tier: ifrc_ngo
      keywords: ["ifrc", "red cross", "red crescent", "national society",
                 "ngo", "non-governmental", "oxfam", "save the children",
                 "world vision", "care international", "msf",
                 "medecins sans frontieres", "mercy corps", "caritas"]
    - tier: media
      keywords: ["media", "news", "reuters", "afp", "associated press", "bbc",
                 "al jazeera", "press report", "local media", "newspaper"]

  # -------------------------------------------------------------------------
  # HOUSEHOLDS -> PEOPLE conversion.
  #
  # The extractor is forbidden from converting units: if a document says
  # "12,000 households", it reports 12000 households and the machine
  # converts here, deterministically, with a declared multiplier. Every
  # converted figure records the multiplier and its origin in provenance,
  # so a reader can undo the conversion.
  #
  # by_iso3 values are average household sizes (UN DESA Household Size and
  # Composition database, rounded to one decimal). The map is deliberately
  # partial: extend it for any country where the default is a poor fit.
  # -------------------------------------------------------------------------
  household_conversion:
    default_multiplier: 5.0
    by_iso3:
      BGD: 4.1
      COL: 3.1
      ETH: 4.6
      HTI: 4.0
      IDN: 3.9
      IND: 4.4
      KEN: 3.9
      LKA: 3.8
      MDG: 4.5
      MMR: 4.3
      MOZ: 4.4
      MWI: 4.4
      NPL: 4.3
      PAK: 6.3
      PHL: 4.1
      SOM: 6.2
      VNM: 3.5
      ZWE: 4.2

# ---------------------------------------------------------------------------
# LLM EXTRACTION (ladder rung 2) — the machine's only paid step.
#
# The model is addressed by ROLE, never by model id: model ids are
# centralised in pythia/config.yaml's llm.models registry and roles block
# (env override > config role > code fallback). The rulebook owns the
# POLICY — which role, how many calls, how much text — and config.yaml owns
# which model backs that role. Putting an id here would fork the repo's
# single source of truth for model choice.
#
# Cost arithmetic at the shipped defaults: a Haiku-class call over a
# 24,000-character document is roughly 6k input + 500 output tokens, about
# USD 0.009. max_calls_per_month = 3000 therefore caps LLM spend near
# USD 28/month, inside the USD 50 ceiling. Every other source in the
# machine is free. (Raised from 1500 on 2026-08-26: the nightly backcast
# shares this calendar-month cap with the live trailing-window runs and had
# consumed all 1500 August calls by mid-month, leaving the first live
# resolver_update run zero extraction budget — owner decision to double it.)
# ---------------------------------------------------------------------------
extraction:
  enabled: true
  model_role: hazard_extraction
  # Bumping this invalidates the extraction cache: a document is re-read
  # when the prompt version or the model changes, and only then. v2: the
  # prompt now names the target month and the country by name, and the
  # parser additionally requires the figure's value to appear in its quote.
  prompt_version: v2
  temperature: 0.0
  max_output_tokens: 2000
  request_timeout_sec: 120
  # Hard cost guard. Counted over haz_doc_extractions rows created in the
  # current CALENDAR month, across every run — so a re-run costs nothing
  # (cached documents are never re-read) and a runaway backcast stops
  # instead of quietly spending. Cells skipped by the cap record
  # extraction_budget_capped in their provenance; they are never silently
  # treated as "ReliefWeb had nothing".
  # Raised 3000 -> 4000 in Sept 2026. The August split gave the live pass a
  # 1000-call reserve and cyclone August exhausted it partway through,
  # stopping at Jamaica with documents fetched and never read. At roughly
  # USD 0.009 a call this is about USD 36/month, still inside the USD 50
  # ceiling above.
  max_calls_per_month: 4000

  # Calls the backcast may NEVER take, whatever its own share says.
  #
  # Until Sept 2026 the live reserve was implicit — whatever the total minus
  # the backcast share happened to be — so raising the backcast share, or
  # dropping it, silently removed the reserve with nothing to notice. Stated
  # here it cannot be lost by accident, and the validator holds
  # Optional: extraction.max_calls_per_run caps ONE run's calls whatever the
  # monthly remainder says. Rung 2 reads documents one at a time (~2.5 s a
  # call), so a live pass handed 2,000 calls runs ~85 minutes and a workflow
  # step that kills it records nothing — a budget stop is recorded per cell.
  # Absent by default; set it when a step budget binds.
  # live_reserve_calls + backcast_max_calls_per_month <= max_calls_per_month.
  #
  # Sized for the live pass: three hazards over the trailing three unfrozen
  # months, which is what resolver_update Phase 2.5 runs on the 28th.
  live_reserve_calls: 1500
  # The nightly backcast's share of that monthly total (it is a carve-out,
  # never an addition — the validator enforces sub-cap <= total). The live
  # trailing-window runs check only the total, so the difference is in
  # effect a reserve for them: the backcast proved it will consume any
  # budget it is given (it spent all of August's 1500 calls by mid-month,
  # leaving the first live resolver_update run nothing), and without a
  # split the monthly run's rung 2 is starved every month the backfill is
  # still converging. Pre-split ledger rows carry run_type NULL and count
  # against the backcast share — every one of them was backcast-created
  # (the live path first runs 2026-08-28).
  backcast_max_calls_per_month: 2000
  # Skip extraction for a cell whose HIGHER ladder rung already has a
  # figure. reliefweb_extracted sits below emdat, so it cannot win those
  # cells — reading them buys only adjacent-rung conflict flags, at roughly
  # a quarter of a dollar per cell. Set false to buy those flags anyway.
  skip_when_higher_rung_populated: true

# ---------------------------------------------------------------------------
# LADDER SOURCE CONNECTORS
#
# Endpoints and window/pacing only. Every one of these services is free;
# the two that need authentication read their key from the environment
# (EMDAT_API_KEY, IDMC_API_KEY) and never from this file.
# ---------------------------------------------------------------------------

emdat:
  # EM-DAT public GraphQL API. Auth: Authorization: Bearer $EMDAT_API_KEY.
  api_url: "https://api.emdat.be/v1"
  request_timeout_sec: 120
  page_limit: 1000
  max_pages: 50
  # EM-DAT classification keys per repo hazard code. EM-DAT keys are
  # "<group>-<subgroup>-<type>-<subtype>"; a prefix matches all subtypes.
  classif_keys:
    FL: ["nat-hyd-flo"]
    TC: ["nat-met-sto-tro"]
    DR: ["nat-cli-dro"]
  # EM-DAT publishes historical records with a lag and revises them. Pull a
  # window around the target month wide enough to catch late entries.
  lookback_months: 3
  lookahead_months: 1

ifrc_go:
  # IFRC GO public API (no key required for the read endpoints used here).
  api_base_url: "https://goadmin.ifrc.org/api/v2/"
  field_report_path: "field-report/"
  page_size: 500
  max_pages: 20
  request_timeout_sec: 60
  # GO field-report fields that state a people-affected figure, best first.
  affected_fields:
    - num_affected
    - gov_num_affected
    - other_num_affected
  lookback_months: 3
  lookahead_months: 2

idmc_idu:
  # IDMC IDU (Internal Displacement Updates). The endpoint URL is supplied
  # by IDMC alongside the key; the key itself is $IDMC_API_KEY, sent as the
  # client_id query parameter.
  api_url: "https://helix-tools-api.idmcdb.org/external-api/idus/all/"
  request_timeout_sec: 120
  # IDU displacement_type values that count as disaster displacement.
  displacement_types: ["Disaster"]
  # IDU hazard sub-type text -> repo hazard code (lowercase substring match).
  hazard_keywords:
    FL: ["flood", "flash flood", "riverine flood"]
    TC: ["cyclone", "typhoon", "hurricane", "tropical storm", "storm"]
    DR: ["drought"]
  lookback_months: 3
  lookahead_months: 1
