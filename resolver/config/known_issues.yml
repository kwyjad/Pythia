#
# Faults already diagnosed, already owned, and not worth re-litigating on
# every run. An id here is reported at severity `known`: one line in the
# stdout block, a `::notice::` rather than a `::error::`, and no repetition
# per occurrence.
#
# Registering an issue does NOT hide it. Every entry still appears in the
# register, still carries its cost, and still names who is chasing it. What
# it stops is the shouting — and a report that shouts about three faults
# nobody in this repository can fix is a report the reader learns to skip.
#
# `review_by` is the expiry. Past that date the issue still reports at
# `known` and the report adds one line saying the entry is overdue, because
# a suppression that never expires is how a known issue becomes an invisible
# one. An entry with NO review date is treated as overdue from the first run.
#
# A review date is CHOSEN, per fault, from how long its remedy should
# reasonably take — not a uniform quarter out, which is a placeholder
# wearing a date's clothes and never fires while anybody is still looking.
# Each entry below says which interval it picked and why. When one comes
# due the answer is to chase it, move the date and say what changed, or
# delete the entry because it is fixed; leaving it is how a known issue
# becomes an invisible one.
#
# Fields:
#   id                 must match the id the collector emits
#   owner              `external` (someone else must fix it) or `pythia`
#   note               who is chasing it and what would resolve it
#   review_by          ISO date; after it, the entry reports as overdue
#   first_seen         ISO date the fault was first observed
#   recovers_on_rerun  optional; overrides the collector's judgement
#   log_connector      a token that, in a normalised ERROR line, says the
#                      line is about THIS fault's connector
#   log_signatures     the normalised shapes this entry absorbs, written out
#                      BY HAND
#
# On log_signatures, and why matching is narrow. An id from the ERROR
# histogram is minted from the log NAME and the normalised line, so it can
# never equal a registered fault's id — which is why run 34081262443
# reported the EM-DAT lockout FIVE times: once as `known` here and four more
# as `degraded` with owner `pythia`, each raising an error annotation. Four
# of that run's seven degraded issues were that one fault.
#
# Matching decides SEVERITY and GROUPING, never visibility: an absorbed shape
# is still printed, with its own count, as an evidence line under the record
# that owns it. And an entry absorbs only the signatures it LISTS — a shape
# naming log_connector but no listed signature still reports on its own at
# `degraded`, with a line saying the connector has a registered issue that
# does not cover it. Anything looser and registering one fault would silence
# the next, unrelated one from the same source, which is the failure the
# register exists to prevent rather than to commit.

issues:
  - id: emdat_auth_rejected
    owner: external
    first_seen: 2026-08-05
    # One month. The remedy is entirely within the owner's reach — renew the
    # key or raise the account tier with EM-DAT — and needs nobody else's
    # release cycle, so a month is already generous. Past it as of
    # 2026-09-09 and reported as overdue, which is the honest reading: the
    # top ladder rung has been unread for over a month.
    review_by: 2026-09-05
    recovers_on_rerun: false
    note: >-
      EM-DAT rejects the configured EMDAT_API_KEY (HTTP 500, "Invalid key
      passed or insufficient user access"). The connector, the query shape
      and the transport are all fine; the account or its tier has to change,
      which is Kevin's to do with EM-DAT. Until then ladder rung 1 is unread
      and the cache answers where it covers the window. No code change helps.
    # Written out by hand from what emdat.py logs at ERROR. Substrings,
    # matched case-insensitively against the NORMALISED line (ISO3 codes,
    # dates and numbers already replaced by placeholders), so a hazard name
    # or a month in the middle of the line does not defeat them.
    log_connector: "[emdat]"
    log_signatures:
      - "[emdat] fetch failed for"
      - "unavailable and the cache holds nothing"
      - "invalid key passed or insufficient user access"

  - id: spei3_commit_token_expiry
    owner: pythia
    first_seen: 2026-09-10
    # DELIBERATELY NO review_by, and the register therefore reports this
    # entry as overdue on every run until somebody fills one in. That is not
    # an oversight: the rule for this entry is `review_by` one month before
    # the token expires, and the expiry date is a fact about a credential
    # that only its holder can read off the GitHub settings page. Guessing it
    # would be worse than leaving it blank — a date invented here would stop
    # the nagging while giving no warning at all when the token actually
    # lapses, which is precisely the failure this entry exists to prevent.
    #
    # To close it: read the expiry from
    # https://github.com/settings/personal-access-tokens, set review_by to
    # one month before that date, and note the expiry in the note below.
    recovers_on_rerun: false
    note: >-
      SPEI-3 is produced by a scheduled workflow that commits
      resolver/data/spei3_country_means.csv straight to main using a
      fine-grained SPEI3_COMMIT_TOKEN, because the default GITHUB_TOKEN
      cannot push past branch protection (GH006). Fine-grained tokens expire.
      When this one does, spei3_refresh.yml fails at its commit step and the
      feed stops extending — the drought gate then loses its only observation
      before the HDX and NMME ingests began, one month at a time, and nothing
      else complains because the rulebook entry is `required: false` with
      `absence_means_no_drought: false`. The remedy is to rotate the token
      before it lapses; the review date is what makes that happen, and it is
      blank because the expiry has not been recorded here yet.

  - id: acled_cast_stale_vintage
    owner: external
    first_seen: 2026-01-15
    # Six weeks from the September escalation. The remedy is somebody at
    # ACLED answering a support request, which is a cycle we do not control
    # and cannot honestly demand inside a fortnight; longer than six weeks
    # and nobody is chasing it.
    review_by: 2026-10-15
    recovers_on_rerun: false
    note: >-
      ACLED CAST has served the 2025-12-01 vintage since the 2026-01 cycle —
      281 days against a 45-day threshold as of run 34222175003. Auth
      succeeds and roughly 9,879 records return, so this is not an outage:
      ACLED is not publishing current CAST through the API. Escalated to
      ACLED (access@acleddata.com). The prompt readers already filter on
      target month, so no past-dated forecast is served.
    # No log_signatures, deliberately: this fault is found by the vintage
    # contradiction check, which declares the right id itself
    # (issue_sources.VINTAGE_ISSUE_IDS), and a stale vintage is logged as a
    # WARNING, which never enters the ERROR histogram. There is nothing to
    # absorb, and inventing a signature would claim a match that cannot
    # happen.

  - id: views_stale_vintage
    owner: external
    first_seen: 2026-07-01
    # Three weeks. Nothing has been escalated yet, and the review is not
    # "has VIEWS fixed it" but "have we asked" — which is a week's work
    # nobody has done. A date far enough out to be fair and near enough to
    # sting.
    review_by: 2026-10-01
    recovers_on_rerun: false
    note: >-
      VIEWS has served the 2026-07-01 vintage since July — 69 days against a
      45-day threshold as of run 34222175003. Same shape as ACLED CAST: the
      connector reads the API successfully and the API's newest run is old.
      Upstream to VIEWS.
    # Same as ACLED CAST: found by the vintage check, logged as a WARNING,
    # so no log signature can match and none is claimed.
