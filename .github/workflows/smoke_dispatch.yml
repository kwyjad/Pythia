---
# ONE-SHOT helper (branch-only, deleted after use): dispatches the Gemini
# batch smoke run with GITHUB_TOKEN. Attempt 2: openai-primary grounding —
# Brave is returning HTTP 402 (out of credit), which tripped the breaker
# and (correctly) blocked every hazard from forecasting on attempt 1.
name: Smoke Dispatch (one-shot)

on:
  push:
    branches: [claude/pythia-code-audit-wc4ndb]
    paths: ['.github/workflows/smoke_dispatch.yml']

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch the Gemini batch smoke run (test mode, IRN+SOM, openai grounding)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh workflow run pythia_pipeline_stage.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref claude/pythia-code-audit-wc4ndb \
            -f stage=fc_submit \
            -f test_mode=true \
            -f batch_providers=google \
            -f only_countries=IRN,SOM \
            -f grounding_primary=openai
          echo "Dispatched pythia_pipeline_stage.yml (fc_submit, test_mode, google-only, IRN+SOM, openai grounding)"
