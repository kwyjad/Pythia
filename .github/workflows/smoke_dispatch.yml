---
# ONE-SHOT helper (branch-only, deleted after use): dispatches the
# fc_collect_finalize stage for smoke pipeline pl_1785235246 directly.
# The production poller lists stage runs with --branch main by design,
# so a branch-ref smoke pipeline is invisible to it and must be advanced
# manually. The collect stage polls the four Gemini batches itself
# (submitted 10:41Z), collects terminal ones, and sync-falls-back on any
# still-running items.
name: Smoke Dispatch (one-shot)

on:
  push:
    branches: [claude/pythia-code-audit-wc4ndb]
    paths: ['.github/workflows/smoke_dispatch.yml']

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch fc_collect_finalize for pl_1785235246
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh workflow run pythia_pipeline_stage.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref claude/pythia-code-audit-wc4ndb \
            -f stage=fc_collect_finalize \
            -f pipeline_id=pl_1785235246 \
            -f db_run_id=30351544746 \
            -f test_mode=true
          echo "Dispatched fc_collect_finalize (pipeline pl_1785235246, db_run_id 30351544746, test mode)"
