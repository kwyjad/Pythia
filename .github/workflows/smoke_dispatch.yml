---
# ONE-SHOT helper (branch-only, deleted after use): the GitHub MCP
# integration cannot POST /dispatches, so this fires on its own push and
# dispatches the Gemini batch smoke run with GITHUB_TOKEN — the same
# mechanism poll_llm_batches.yml and the calibration→publish chain use.
name: Smoke Dispatch (one-shot)

on:
  push:
    branches: [claude/pythia-code-audit-wc4ndb]
    paths: ['.github/workflows/smoke_dispatch.yml']

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch the Gemini batch smoke run (test mode, IRN+SOM)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh workflow run pythia_pipeline_stage.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref claude/pythia-code-audit-wc4ndb \
            -f stage=fc_submit \
            -f test_mode=true \
            -f batch_providers=google \
            -f only_countries=IRN,SOM
          echo "Dispatched pythia_pipeline_stage.yml (fc_submit, test_mode, google-only, IRN+SOM)"
