---
name: Pythia — Compute SPD Scores

on:
  workflow_run:
    workflows: ["Pythia — Compute Resolutions"]
    types: [completed]
    # A run triggered from a fork's pull request is never one of ours,
    # whatever its branch is called; the job if: below checks both.
    branches: [main]

  # Optional manual trigger
  workflow_dispatch: {}

permissions:
  contents: read
  # write: a run the Actions bot dispatched starts the next link itself.
  actions: write

jobs:
  # A triggering run that concluded "success" may still have done nothing:
  # a run its pipeline gate skipped uploads no canonical DB, and on
  # 5 October 2026 such a skipped Resolver Update started this whole chain
  # on whatever DB discovery found. Ask whether the trigger uploaded one.
  trigger:
    name: Did the triggering run upload a canonical DB?
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.event != 'pull_request') }}
    runs-on: ubuntu-latest
    outputs:
      did_work: ${{ steps.check.outputs.did_work }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check the triggering run's artifacts
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
        run: python3 -m scripts.ci.canonical_guard trigger-did-work

  compute-scores:
    needs: trigger
    if: needs.trigger.outputs.did_work == 'true'
    # On the writing job, not the workflow: the trigger check above must
    # never take the group's one pending slot (CLAUDE.md, CI wiring).
    concurrency:
      group: pythia-resolver-db
      cancel-in-progress: false
    runs-on: ubuntu-latest
    env:
      RESOLVER_DB_URL: duckdb:///${{ github.workspace }}/data/resolver.duckdb

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (minimal)
        run: |
          python -m pip install --upgrade pip
          pip install -r python_library_requirements.txt
          pip install duckdb

      # Path A: triggering Compute Resolutions run; Path B (manual dispatch or
      # expired artifact): canonical discovery — previously manual dispatch
      # always failed here because workflow_run.id is empty on dispatch.
      - name: Download canonical resolver DB
        id: canonical_download
        uses: ./.github/actions/download-canonical-db
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Compute SPD scores for PA/FATALITIES
        env:
          # Ensure config points to the right DuckDB; adjust if you use a different path
          PYTHIA_CONFIG_YAML: "pythia/config.yaml"
        run: |
          echo "=== Running pythia.tools.compute_scores ==="
          python -m pythia.tools.compute_scores --db-url "${RESOLVER_DB_URL}"
          echo "=== compute_scores completed ==="

      - name: Score ViEWS conflict forecasts
        env:
          PYTHIA_CONFIG_YAML: "pythia/config.yaml"
        run: |
          echo "=== Running pythia.tools.score_views ==="
          python -m pythia.tools.score_views --db-url "${RESOLVER_DB_URL}"
          echo "=== score_views completed ==="

      # Reference forecasters (__ext_climatology / __ext_uniform) — the skill
      # baselines the interpreter's "how well did we do" section divides by.
      # Non-fatal: a baseline-scoring bug must never block the scores upload.
      - name: Score climatology/uniform baselines
        continue-on-error: true
        env:
          PYTHIA_CONFIG_YAML: "pythia/config.yaml"
        run: |
          echo "=== Running pythia.tools.score_baselines ==="
          python -m pythia.tools.score_baselines --db-url "${RESOLVER_DB_URL}"
          echo "=== score_baselines completed ==="

      - name: Refuse to upload over a newer canonical DB
        if: success()
        uses: ./.github/actions/guard-canonical-upload
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          downloaded-run-id: ${{ steps.canonical_download.outputs.run-id }}
          source: ${{ steps.canonical_download.outputs.source }}

      - name: Upload canonical resolver DB
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pythia-resolver-db
          retention-days: 90
          path: data/resolver.duckdb

      # GitHub fires no workflow_run event for a run that GITHUB_TOKEN
      # dispatched, so a chain started that way (compact_resolver_db's
      # conflict_displacement_reset, 6 October 2026) stopped after this
      # workflow. Such a run starts the next link itself; a run a person
      # dispatched, or one started by workflow_run, leaves it to the event.
      - name: Continue the chain (Calibration)
        if: success() && github.event_name == 'workflow_dispatch' && github.actor == 'github-actions[bot]'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run compute_calibration_pythia.yml --ref main --repo "${GITHUB_REPOSITORY}"
