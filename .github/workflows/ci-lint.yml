---
name: CI Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: YAML Lint
        uses: ibiqlik/action-yamllint@v3
        with:
          config_file: .yamllint.yml
          file_or_dir: |
            .github/workflows

      # These checks live in resolver/tests/ but guard .github/workflows/**,
      # and resolver-ci-fast has no workflow path trigger — so a workflow-only
      # PR never ran them and could (and did) land a violation on main. This
      # job runs on every PR, and the checks are stdlib-only (pathlib + re).
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # --noconftest: the test file itself is stdlib-only (pathlib + re), but
      # resolver/tests/conftest.py pulls in the fast-export fixtures (pandas /
      # duckdb / pyarrow). Skipping conftest keeps this job at "pip install
      # pytest" instead of the full resolver dependency set.
      - name: Workflow shell/YAML sanity checks
        run: |
          set -e
          python -m pip install --upgrade pip
          pip install pytest
          pytest -vv --noconftest resolver/tests/test_ci_shell_sanity.py

      # The cron watchdog guards .github/workflows/** the same way the sanity
      # checks do (one of its tests reads every workflow's `name:` to catch a
      # typo in the watched list), and it is stdlib-only, so it belongs in the
      # one job that runs on every PR. Per the repo's standing rule, a test
      # file named in no workflow runs nowhere.
      - name: Cron watchdog tests
        run: pytest -vv --noconftest tests/test_check_workflow_freshness.py

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Actionlint
        run: |
          set -e
          GOBIN="${GITHUB_WORKSPACE}/.bin"
          export GOBIN
          export PATH="${GOBIN}:${PATH}"
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.9
          actionlint -color
