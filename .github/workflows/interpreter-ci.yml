---
name: Interpreter CI

on:
  pull_request:
    paths:
      - "interpreter/**"
      - "scripts/ai_bundle/**"
      - "pythia/llm_profiles.py"
      - "pythia/config.yaml"
      - "python_library_requirements.txt"
      # The interpreter API surface (Phase 5): the route module and its test
      # live outside interpreter/ but change with it. Named explicitly —
      # nothing runs pythia/tests/ broadly.
      - "pythia/api/routes/interpreter.py"
      - "pythia/tests/test_api_interpreter.py"
      # Self-reference (same rule as forecaster-ci): a PR editing this
      # workflow's own test list must run the list it edited.
      - ".github/workflows/interpreter-ci.yml"

  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  interpreter-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r python_library_requirements.txt
          pip install pytest

      - name: Run interpreter tests
        run: |
          # Fully deterministic: the model call is mocked, DBs are temp
          # files, no network. The ai_bundle suites run here too because the
          # interpreter consumes those bundles — a pack-shape change must
          # re-run both sides (they also run in forecaster-ci; duplicate
          # execution is cheap, a gap is not).
          echo "=== Running interpreter + ai_bundle tests ==="
          pytest -vv interpreter/tests/ scripts/ai_bundle/tests/ \
            pythia/tests/test_api_interpreter.py
