---
name: Horizon Scanner CI

on:
  push:
    branches: [main]
    paths:
      - "horizon_scanner/**"
      - "scripts/ci/snapshot_prompt_artifact.py"
      - "scripts/ci/tests/test_snapshot_prompt_artifact.py"
      - "resolver/tests/test_hs_hazard_tail_packs_schema_and_writer.py"
      # More resolver/tests files that guard horizon_scanner/. resolver-ci-fast
      # runs them but triggers only on resolver/**, so a horizon_scanner-only PR
      # re-ran none of them. test_ci_shell_sanity.py enforces this wiring.
      - "resolver/tests/test_hs_prompt_imports.py"
      - "resolver/tests/test_hs_rc_promoted_selection.py"
      - "resolver/tests/test_hs_regime_change.py"
      - "resolver/tests/test_hs_tail_trigger_query.py"
      - "resolver/tests/test_rc_calibration.py"
      - "resolver/tests/test_hs_triage_resilience_and_rerun_lists.py"
      - "pythia/db/schema.py"
      - "pythia/buckets.py"
      - ".github/workflows/horizon-scanner-ci.yml"
  pull_request:
    paths:
      - "horizon_scanner/**"
      - "scripts/ci/snapshot_prompt_artifact.py"
      - "scripts/ci/tests/test_snapshot_prompt_artifact.py"
      - "resolver/tests/test_hs_hazard_tail_packs_schema_and_writer.py"
      # More resolver/tests files that guard horizon_scanner/. resolver-ci-fast
      # runs them but triggers only on resolver/**, so a horizon_scanner-only PR
      # re-ran none of them. test_ci_shell_sanity.py enforces this wiring.
      - "resolver/tests/test_hs_prompt_imports.py"
      - "resolver/tests/test_hs_rc_promoted_selection.py"
      - "resolver/tests/test_hs_regime_change.py"
      - "resolver/tests/test_hs_tail_trigger_query.py"
      - "resolver/tests/test_rc_calibration.py"
      - "resolver/tests/test_hs_triage_resilience_and_rerun_lists.py"
      - "pythia/db/schema.py"
      - "pythia/buckets.py"
      - ".github/workflows/horizon-scanner-ci.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  horizon-scanner-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (minimal, via python_library_requirements.txt)
        run: |
          python -m pip install --upgrade pip
          pip install -r python_library_requirements.txt
          pip install pytest pytest-timeout

      - name: Run Horizon Scanner unit tests (network-excluded, deterministic)
        run: |
          # Excludes the live-API tests (markers: allow_network / network) so
          # the suite is deterministic and offline in CI. This closes the
          # documented gap where no workflow ran horizon_scanner/** tests —
          # e.g. the seasonal-TC tercile-safety guard and the prompt-artifact
          # question-loader regression test.
          # The tail-packs writer test lives under resolver/tests but guards
          # horizon_scanner/db_writer.py. resolver-ci-fast does not trigger on
          # horizon_scanner/**, so without naming it here a change to the
          # writer would run no test that covers it.
          pytest -vv \
            horizon_scanner/ \
            scripts/ci/tests/test_snapshot_prompt_artifact.py \
            resolver/tests/test_hs_hazard_tail_packs_schema_and_writer.py \
            resolver/tests/test_hs_prompt_imports.py \
            resolver/tests/test_hs_rc_promoted_selection.py \
            resolver/tests/test_hs_regime_change.py \
            resolver/tests/test_hs_tail_trigger_query.py \
            resolver/tests/test_rc_calibration.py \
            resolver/tests/test_hs_triage_resilience_and_rerun_lists.py \
            -m "not allow_network and not network"
