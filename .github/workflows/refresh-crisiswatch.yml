---
name: Refresh CrisisWatch Data

concurrency:
  group: pythia-crisiswatch-refresh
  cancel-in-progress: false

# NOTE (July 2026): crisisgroup.org's Cloudflare blocks CI-runner
# Playwright fetches, so this workflow fetches the SERVER-RENDERED page
# from the Internet Archive instead (--source wayback): trigger a Save
# Page Now capture (best-effort; authenticated when the optional
# IA_S3_ACCESS_KEY / IA_S3_SECRET_KEY secrets are set — free keys from
# https://archive.org/account/s3.php), then walk CDX snapshots newest-
# first with validation that rejects Cloudflare-challenged captures.
#
# ICG publishes the previous month's edition in the first days of each
# month; the early-month cron burst plus --only-if-newer makes repeat
# runs idempotent no-ops. --max-age-days turns runs red when the on-disk
# edition is more than two months stale, and --expect-edition-by-day
# catches a single MISSED edition, which an age threshold cannot see. The
# local Playwright path (--source live, default) still works for manual
# refreshes.
#
# NOTE (Aug 2026): this workflow no longer commits anything. It used to
# `git push` the refreshed JSON to main, and branch protection began
# rejecting that around 2026-08-06 (GH006, "Changes must be made through a
# pull request") — so every run since scraped successfully and then went
# red, while the checked-in edition froze at 2026-07-29 and
# resolver_update's Phase 4 carried on storing that stale edition into
# crisiswatch_entries behind a green step.
#
# The consumer is the DATABASE, not the file: crisiswatch.py is DB-first,
# and resolver_update Phase 4 now refreshes the edition on its own runner
# before storing it, where no push is involved. This workflow's remaining
# job is early-month monitoring and manual diagnosis — it scrapes, checks
# the edition, and keeps the artifact. Do not reintroduce a push; a token
# able to write to main is not worth it for a file nothing reads any more.
"on":
  schedule:
    - cron: "17 6 3,5,7,10 * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Parse and report even if the edition is not newer than the checked-in JSON"
        required: false
        default: false
        type: boolean

# read-only since the commit step was removed: the refreshed edition reaches
# its consumer through resolver_update's Phase 4, not through a push to main.
permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  refresh:
    name: Fetch & parse ICG CrisisWatch via Wayback Machine
    runs-on: ubuntu-latest
    # Headroom for the patient fresh-capture retry (worst case ~370s
    # on top of the SPN wait). Losing a monthly edition to a
    # transient archive.org refusal costs far more than the minutes.
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python packages (no browser needed)
        run: |
          python -m pip install --upgrade pip
          pip install "requests>=2.32,<3" "beautifulsoup4>=4.12,<5" "PyYAML>=6.0,<7"

      - name: Run CrisisWatch refresh (wayback source)
        env:
          IA_S3_ACCESS_KEY: ${{ secrets.IA_S3_ACCESS_KEY }}
          IA_S3_SECRET_KEY: ${{ secrets.IA_S3_SECRET_KEY }}
        run: |
          FORCE_FLAG=""
          if [ "${{ inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          python -m scripts.refresh_crisiswatch \
            --source wayback \
            --only-if-newer \
            --max-age-days 60 \
            --expect-edition-by-day 7 \
            $FORCE_FLAG \
            --verbose

      - name: Upload CrisisWatch JSON
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crisiswatch-data-${{ github.run_id }}
          path: |
            horizon_scanner/data/crisiswatch_latest.json
            horizon_scanner/data/crisiswatch_debug.html
          retention-days: 90
