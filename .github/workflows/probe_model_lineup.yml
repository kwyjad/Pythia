---
# Live check of the December 2026 lineup (GPT-6.1 Sol, Gemini 4 Argon,
# Gemini 3.8 Flash) before the swap merges: Gemini model metadata, one real
# SPD call per new model through the sync path, and a two-item Argon batch.
# Writes nothing to any database (PYTHIA_TEST_MODE=1, no DB URL), so it is
# not in the pythia-resolver-db concurrency group. Dispatch only.
name: Probe model lineup

on:
  workflow_dispatch:
    inputs:
      batch_wait_min:
        description: "Minutes to wait on the Argon batch before cancelling"
        required: false
        default: "30"
      skip_batch:
        description: "Skip the Argon batch"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r python_library_requirements.txt

      - name: Probe the lineup
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHIA_TEST_MODE: "1"
          PYTHIA_LLM_PROFILE: prod
          BATCH_WAIT_MIN: ${{ inputs.batch_wait_min || '30' }}
          SKIP_BATCH: ${{ inputs.skip_batch == true || inputs.skip_batch == 'true' }}
        run: |
          set -o pipefail
          extra=""
          if [ "${SKIP_BATCH}" = "true" ]; then extra="--skip-batch"; fi
          python -m tools.probe_model_lineup \
            --out diagnostics/model_lineup_probe.json \
            --batch-wait-min "${BATCH_WAIT_MIN}" ${extra}

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-model-lineup
          path: diagnostics/model_lineup_probe.json
          retention-days: 14
