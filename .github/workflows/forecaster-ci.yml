---
name: Forecaster CI — SPD

# Per-ref CI group (same pattern as resolver-ci-fast / resolver-smoke).
# NEVER put this workflow back in the pythia-resolver-db group: it only
# builds a placeholder DB (`: > data/resolver.duckdb`) and never touches
# the canonical artifact — and a concurrency group holds exactly ONE
# pending run, so a PR run queued in that group while the nightly backcast
# held it would CANCEL a pending scheduled Resolver Update.
concurrency:
  group: forecaster-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "forecaster/**"
      - "horizon_scanner/**"
      - "pythia/db/**"
      - "pythia/tools/**"
      - "pythia/web_research/**"
      - "pythia/llm_profiles.py"
      - "pythia/config.yaml"
      - "python_library_requirements.txt"
      - "scripts/ai_bundle/**"
      - "pythia/llm_batch.py"
      - "pythia/model_costs.json"
      - "pythia/tests/**"
      - "pythia/buckets.py"
      - "pythia/api/app.py"
      - "pythia/api/core.py"
      - "pythia/api/routes/risk_index.py"
      # resolver/tests files that guard forecaster/pythia code. resolver-ci-fast
      # runs all of resolver/tests/ but triggers only on resolver/**, so without
      # naming them here a PR touching only forecaster/ or pythia/ runs none of
      # them. test_ci_shell_sanity.py enforces this wiring.
      - "resolver/tests/test_idmc_history_conflict_pa.py"
      - "resolver/tests/test_hs_triage_resilience_and_rerun_lists.py"
      - "resolver/tests/test_forecaster_llm_logging_inserts_row.py"
      - "resolver/tests/test_conflict_forecasts_table.py"
      - "resolver/tests/test_eiv_scoring.py"
      - "resolver/tests/test_risk_index_prefers_bayesmc.py"
      # The PA resolution machine's base-rate block is rendered into every
      # PA SPD prompt from rulebook.yaml at prompt-build time. A rulebook or
      # renderer change therefore changes forecaster prompt text, so the
      # assembled-prompt snapshots have to re-run on it. rulebook.py is the
      # LOADER those two go through — a loader change can move rendered
      # prompt text just as surely as a YAML edit.
      - "resolver/hazard_resolution/prompt_block.py"
      - "resolver/hazard_resolution/rulebook.yaml"
      - "resolver/hazard_resolution/rulebook.py"
      - "resolver/hazard_resolution/extract.py"
      - "resolver/tests/test_hazard_resolution_extraction.py"
      - "pythia/api/routes/costs.py"
      - "scripts/ci/poll_llm_batches.py"
      - "scripts/ci/check_pipeline_active.py"
      - "scripts/ci/batch_economics.py"
      - "scripts/ci/stage_health.py"
      - "scripts/ci/tests/test_batch_economics.py"
      - "scripts/ci/tests/test_stage_health.py"
      - "scripts/ci/build_release_db.py"
      - "scripts/ci/tests/test_build_release_db.py"
      - "scripts/ci/db_table_sizes.py"
      - "scripts/ci/tests/test_db_table_sizes.py"
      - ".github/workflows/pythia_pipeline_stage.yml"
      - ".github/workflows/publish_latest_data.yml"
      # Self-reference, as horizon-scanner-ci.yml already does: without it a PR
      # editing this workflow's own test list never runs the list it edited.
      - ".github/workflows/forecaster-ci.yml"
      - "tests/test_poll_llm_batches_guard.py"
      - "tests/test_check_pipeline_active.py"

  workflow_dispatch:
    inputs:
      spd_mode:
        description: "SPD mode for this run"
        required: true
        default: "default"
        type: choice
        options:
          - default
          - dual_compare
          - bayesmc_write
          - dual_compare_bayesmc_write
      run_spd_smoke:
        description: "Run one-question SPD smoke compare (writes spd-compare-smoke artifact)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      smoke_iso3:
        description: "Smoke ISO3"
        required: false
        default: "SOM"
        type: string
      smoke_hazard:
        description: "Smoke hazard code"
        required: false
        default: "ACE"
        type: string
      smoke_metric:
        description: "Smoke metric"
        required: false
        default: "PA"
        type: string
      smoke_target_month:
        description: "Smoke target month (YYYY-MM)"
        required: false
        default: "2025-12"
        type: string

permissions:
  contents: read

jobs:
  forecaster-spd-tests:
    environment: prod-llm
    runs-on: ubuntu-latest
    env:
      RESOLVER_DB_URL: duckdb:///${{ github.workspace }}/data/resolver.duckdb
      PYTHIA_LLM_CONCURRENCY: "8"
      HS_MAX_WORKERS: "4"
      FORECASTER_RESEARCH_MAX_WORKERS: "4"
      FORECASTER_SPD_MAX_WORKERS: "4"
      PYTHIA_WEB_RESEARCH_ENABLED: "0"
      PYTHIA_RETRIEVER_ENABLED: "0"
      PYTHIA_MODEL_SELF_SEARCH_ENABLED: "0"
      PYTHIA_SPD_WEB_SEARCH_ENABLED: "0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure resolver DB file exists (placeholder)
        shell: bash
        run: |
          mkdir -p data
          if [ ! -f "data/resolver.duckdb" ]; then
            echo "Creating empty placeholder data/resolver.duckdb"
            : > data/resolver.duckdb
          fi

      - name: Check canonical DB presence
        run: |
          ls -R data || true
          if [ ! -f data/resolver.duckdb ]; then
            echo "WARNING: data/resolver.duckdb not found; Forecaster will run on a fresh DB."
          fi

      - name: Debug context (ref, SHA, changed files)
        env:
          GITHUB_REF_SAFE: ${{ github.ref }}
          GITHUB_BASE_REF_SAFE: ${{ github.base_ref }}
          GITHUB_HEAD_REF_SAFE: ${{ github.head_ref }}
          GITHUB_SHA_SAFE: ${{ github.sha }}
        run: |
          echo "Ref: ${GITHUB_REF_SAFE}"
          echo "Base ref: ${GITHUB_BASE_REF_SAFE}"
          echo "Head ref: ${GITHUB_HEAD_REF_SAFE}"
          echo "SHA: ${GITHUB_SHA_SAFE}"
          echo "Changed files (base..head):"
          # This can fail on some PR types; don't fail the job if it does
          if [ -n "${GITHUB_BASE_REF_SAFE}" ]; then
            git fetch origin "${GITHUB_BASE_REF_SAFE}" --depth=1 || true
            git diff --name-only "origin/${GITHUB_BASE_REF_SAFE}"...HEAD || true
          else
            echo "No base_ref available (e.g. direct push); skipping git diff."
          fi
          echo "Repo tree (top-level):"
          ls -R

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (minimal, via python_library_requirements.txt)
        run: |
          python -m pip install --upgrade pip
          pip install -r python_library_requirements.txt
          pip install pytest

      - name: === Running Forecaster SPD unit tests ===
        env:
          PYTHIA_DEBUG_SPD: "1"
          PYTHIA_DEBUG_DB: "1"
          PYTHIA_SPD_V2_DUAL_RUN: "0"
          PYTHIA_SPD_V2_USE_BAYESMC: "0"
        run: |
          echo "=== Running Forecaster SPD unit tests ==="
          pytest -vv \
            forecaster/tests/test_spd.py \
            forecaster/tests/test_spd_json_repair.py

      - name: === Running model registry + provider guards ===
        run: |
          # The model registry / cost-table sync guard previously ran in NO
          # workflow, so a lineup swap that forgot a model_costs.json entry
          # (silent $0 cost logging + a broken Sibyl budget cap) or forgot to
          # extend _ANTHROPIC_NO_TEMPERATURE_PREFIXES (HTTP 400 on every Claude
          # and Sibyl call) reached main green.
          echo "=== Running model registry + provider guards ==="
          pytest -vv \
            pythia/tests/test_model_registry.py \
            forecaster/tests/test_providers.py \
            forecaster/tests/test_spd_model_params.py

      - name: Run AI analysis bundle + sent-prompt logging tests
        run: |
          echo "=== Running scored-forecast bundle builder tests ==="
          pytest -vv \
            scripts/ai_bundle/tests/ \
            forecaster/tests/test_sent_prompt_logging.py

      - name: Run Batch-API + prompt-cache + orchestration tests
        run: |
          # These suites previously ran in NO workflow (forecaster-ci runs an
          # explicit file list and nothing runs pythia/tests broadly), so the
          # entire staged-pipeline seam could regress with green CI.
          echo "=== Running Batch-API / prompt-cache / poller / gate tests ==="
          pytest -vv \
            pythia/tests/test_llm_batch.py \
            pythia/tests/test_api_llm_costs.py \
            forecaster/tests/test_batch_phase.py \
            forecaster/tests/test_prompt_v3_order.py \
            forecaster/tests/test_prompt_cache_wiring.py \
            tests/test_poll_llm_batches_guard.py \
            tests/test_check_pipeline_active.py \
            scripts/ci/tests/test_batch_economics.py \
            scripts/ci/tests/test_stage_health.py \
            scripts/ci/tests/test_build_release_db.py \
            scripts/ci/tests/test_db_table_sizes.py

      - name: Run base-rate history + rendering tests
        run: |
          # _build_history_summary and _format_base_rate_for_prompt decide the
          # prior anchor in every SPD prompt, and neither suite ran in any
          # workflow — which is how ACE/PA sat on the legacy JSON-dump branch
          # with test_history_summary red on main and nobody seeing it.
          echo "=== Running base-rate history + rendering tests ==="
          # test_idmc_history_conflict_pa lives under resolver/tests but covers
          # forecaster's ACE/PA base rate. resolver-ci-fast does not trigger on
          # forecaster/**, which is how it sat red on main after #816 re-routed
          # ACE/PA without anything re-running it.
          # test_base_rate_matches_resolution_source pins the base rate to the
          # metrics the resolver will actually score. It exists because the
          # natural-hazard PA profile matched 'in_need' — GDACS modelled
          # population exposure — and served it to models as IFRC reported
          # impact, a figure orders of magnitude larger that the resolver would
          # never use. See docs/montandon_assessment.md.
          # test_haz_base_rate_prompt asserts the PA resolution machine's
          # base-rate block actually reaches the assembled SPD prompt. A
          # loader whose text nobody renders costs money and changes nothing
          # — the repo has lost CrisisWatch and the HS grounding packs that
          # way — and only an assembled-prompt assertion catches it. It also
          # pins that a rulebook.yaml change moves the prompt with no code
          # change, which is why rulebook.yaml is in this workflow's paths.
          # test_hazard_resolution_extraction guards the machine's one PAID
          # step and now asserts its llm_calls telemetry lands (it imports
          # pythia for the end-to-end row check), so it runs here as well as
          # in resolver-ci-fast — duplicate execution is cheap, a gap is not.
          pytest -vv \
            forecaster/tests/test_history_summary.py \
            forecaster/tests/test_fewsnet_history.py \
            forecaster/tests/test_base_rate_matches_resolution_source.py \
            forecaster/tests/test_haz_base_rate_prompt.py \
            resolver/tests/test_idmc_history_conflict_pa.py \
            resolver/tests/test_hazard_resolution_extraction.py

      - name: Run deviation + baseline-scoring tests (interpreter Phase 1)
        run: |
          # base_rate_spd / compute_deviation / score_baselines live in
          # pythia/tools and their tests in pythia/tests — which no workflow
          # runs broadly, so they must be named here explicitly (CI runs
          # explicit test-file lists; an unnamed test file runs NOWHERE).
          echo "=== Running interpreter Phase 1 tests ==="
          pytest -vv \
            pythia/tests/test_base_rate_spd.py \
            pythia/tests/test_base_rate_anchor_depth.py \
            pythia/tests/test_compute_deviation.py \
            pythia/tests/test_score_baselines.py

      - name: Run debug-bundle tests
        run: |
          # These ran in NO workflow — forecaster-ci executes an explicit file
          # list, so a bundle change reached main with nothing covering it. That
          # is how the bundle came to report "LLM Calls: OK" for a run that had
          # lost the batch discount on two thirds of its spend.
          echo "=== Running debug bundle tests ==="
          pytest -vv \
            forecaster/tests/test_debug_bundle.py \
            forecaster/tests/test_debug_bundle_llm_calls.py \
            forecaster/tests/test_debug_bundle_adversarial_stats.py \
            forecaster/tests/test_debug_bundle_batch_economics.py

      - name: Run resolver/tests suites that guard forecaster + pythia code
        run: |
          # Same class of gap as test_idmc_history_conflict_pa above: these
          # files live under resolver/tests but import forecaster/ and pythia/.
          # resolver-ci-fast runs them, but only triggers on resolver/**, so a
          # PR touching only the code they guard re-ran nothing.
          echo "=== Running cross-package resolver/tests suites ==="
          pytest -vv \
            resolver/tests/test_hs_triage_resilience_and_rerun_lists.py \
            resolver/tests/test_forecaster_llm_logging_inserts_row.py \
            resolver/tests/test_conflict_forecasts_table.py \
            resolver/tests/test_eiv_scoring.py \
            resolver/tests/test_risk_index_prefers_bayesmc.py

      - name: Run SPD experimental mode (dual/bayesmc)
        if: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.spd_mode == 'bayesmc_write' || github.event.inputs.spd_mode == 'dual_compare_bayesmc_write') }}
        env:
          PYTHIA_DEBUG_SPD: "1"
          PYTHIA_DEBUG_DB: "1"
          PYTHIA_SPD_V2_DUAL_RUN: "0"
          PYTHIA_SPD_V2_USE_BAYESMC: "0"
        run: |
          echo "=== Running SPD experimental mode ==="
          echo "spd_mode=${{ github.event.inputs.spd_mode }}"
          echo "PYTHIA_SPD_V2_DUAL_RUN=$PYTHIA_SPD_V2_DUAL_RUN"
          echo "PYTHIA_SPD_V2_USE_BAYESMC=$PYTHIA_SPD_V2_USE_BAYESMC"
          pytest -vv forecaster/tests/test_spd.py -k "bayesmc_flag"

      - name: Run SPD smoke compare (workspace)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_spd_smoke == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PYTHONPATH: ${{ github.workspace }}
          PYTHIA_SPD_V2_DUAL_RUN: ${{ (github.event.inputs.spd_mode == 'dual_compare' || github.event.inputs.spd_mode == 'dual_compare_bayesmc_write') && '1' || '0' }}
          PYTHIA_SPD_V2_USE_BAYESMC: ${{ (github.event.inputs.spd_mode == 'bayesmc_write' || github.event.inputs.spd_mode == 'dual_compare_bayesmc_write') && '1' || '0' }}
          PYTHIA_SPD_COMPARE_DIR: "debug/spd_compare_smoke"

          SPD_SMOKE_RUN_ID: smoke_${{ github.run_id }}
          SPD_SMOKE_ISO3: ${{ github.event.inputs.smoke_iso3 }}
          SPD_SMOKE_HAZARD: ${{ github.event.inputs.smoke_hazard }}
          SPD_SMOKE_METRIC: ${{ github.event.inputs.smoke_metric }}
          SPD_SMOKE_TARGET_MONTH: ${{ github.event.inputs.smoke_target_month }}
          SPD_SMOKE_QID: SMOKE_${{ github.event.inputs.smoke_iso3 }}_${{ github.event.inputs.smoke_hazard }}_${{ github.event.inputs.smoke_metric }}_${{ github.event.inputs.smoke_target_month }}
        run: |
          mkdir -p debug/spd_compare_smoke
          PYTHIA_DEBUG_MODELS=1 python -m scripts.print_forecaster_ensemble
          python -u scripts/run_spd_dual_smoke.py

      - name: Assert smoke compare JSON exists
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_spd_smoke == 'true'
        shell: bash
        run: |
          echo "Smoke compare dir contents:"
          ls -la debug/spd_compare_smoke || true
          smoke_json="$(find debug/spd_compare_smoke -maxdepth 1 -type f -name '*.json' -print -quit)"
          if [ -z "$smoke_json" ]; then
            echo "No smoke compare JSON produced"
            exit 1
          fi

      - name: Collect SPD compare JSONs from pytest temp dirs
        if: ${{ always() && github.event_name == 'workflow_dispatch' && (github.event.inputs.spd_mode == 'dual_compare' || github.event.inputs.spd_mode == 'dual_compare_bayesmc_write') }}
        shell: bash
        run: |
          mkdir -p debug/spd_compare_tests
          # Copy any compare JSONs produced under pytest tmp dirs into the workspace
          find /tmp/pytest-of-runner -type f -path "*/debug/spd_compare/*.json" -print -exec cp {} debug/spd_compare_tests/ \; || true
          echo "Collected unit test compare JSON count:"
          find debug/spd_compare_tests -maxdepth 1 -type f -name '*.json' -print | wc -l || true

      - name: Upload SPD compare test artifacts
        if: ${{ always() && github.event_name == 'workflow_dispatch' && (github.event.inputs.spd_mode == 'dual_compare' || github.event.inputs.spd_mode == 'dual_compare_bayesmc_write') }}
        uses: actions/upload-artifact@v4
        with:
          name: spd-compare-tests
          path: debug/spd_compare_tests/*.json
          if-no-files-found: warn

      - name: Upload SPD smoke compare artifacts
        if: always() && github.event_name == 'workflow_dispatch' && github.event.inputs.run_spd_smoke == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: spd-compare-smoke
          path: debug/spd_compare_smoke/*.json
          if-no-files-found: warn
