# The SPEI-3 drought feed, produced on a schedule instead of by hand.
#
# The drought gate has no observation reaching back before the HDX and NMME
# ingests began, so most of the backcast's window resolves INCONCLUSIVE: a
# cell no feed NAMED is "not looked at", and one under min_answered_for_zero
# cannot rest a zero on absence. SPEI-3 is the observation those years are
# missing. It is a global raster, and turning a raster into a country number
# is zonal statistics, which the rulebook says does not belong in a
# resolution run — so this workflow produces
# resolver/data/spei3_country_means.csv and the rulebook's existing `tabular`
# provider reads the committed file.
#
# Three properties this workflow has to keep.
#
# It cannot contend for the canonical DB. Its concurrency group is its own,
# NOT pythia-resolver-db, so it can never cancel the nightly backcast or the
# monthly ingest. That is also why it does not restale the resume ledger
# itself: it commits the request into the status file and the backcast
# applies it (resolver/hazard_resolution/backcast.py::apply_feed_restale).
#
# It fails closed. A candidate that misses any validation gate is uploaded as
# an artifact and the committed CSV is left exactly as it was. A wrong feed
# poisons every month it covers; a stale one only costs the months it does
# not.
#
# SETUP. Two secrets, and the producer does nothing durable without either.
#
#   CDSAPI_KEY           the Copernicus Climate Data Store API token, from an
#                        account that has accepted this dataset's licence.
#   SPEI3_COMMIT_TOKEN   a fine-grained personal access token with Contents:
#                        read and write on this repository, and permission to
#                        bypass branch protection on the default branch.
#                        The default GITHUB_TOKEN cannot do this: branch
#                        protection here refuses a CI push to main (GH006,
#                        observed from 2026-08-06 — it is what stopped
#                        refresh-crisiswatch.yml committing its scrape). A
#                        pull request is not an alternative, for the reason
#                        the commit step sets out at length.
#
# The token in use was issued with NO expiry, so it cannot lapse on a
# schedule and there is no date to warn about. It can still be revoked, have
# its permissions narrowed, or lose access when the owning account changes —
# and then this producer stops committing and the feed silently stops
# extending. So the guard is refusal-based: the commit step classifies a
# failed push and fails through a step whose NAME carries the class, and the
# run issue register reads that name and reports `spei3_commit_refused` at
# `degraded`. The argument for that design lives in the
# `spei3_commit_credential` entry of resolver/config/known_issues.yml.
#
# It is resumable. A CDS request is an asynchronous job that can sit queued
# for hours against a six-hour job cap, so the fetch carries a deadline and
# reports the years it still owes rather than failing. `reduce` MERGES on
# (iso3, ym), so a partial run is a smaller merge and never a truncation —
# which is what makes resumption safe rather than merely possible.

---
name: SPEI-3 Feed Refresh

# Its own group, deliberately. See the header.
concurrency:
  group: spei3-feed
  cancel-in-progress: false

"on":
  workflow_dispatch:
    inputs:
      from_ym:
        description: "First month to consider (YYYY-MM; the series starts 2016-01)"
        required: false
        default: ""
        type: string
      to_ym:
        description: "Last month to consider (YYYY-MM; blank = the last complete month)"
        required: false
        default: ""
        type: string
      full_rebuild:
        description: >-
          Fetch and reduce EVERY month in the range rather than the trailing
          revision window plus what the CSV is missing. Use it once, for the
          initial 2016-to-present build. If one job cannot finish inside six
          hours the deadline stops it cleanly and the next run resumes: run
          it twice.
        required: false
        default: false
        type: boolean
      probe:
        description: >-
          Ask the CDS what `dataset_type` accepts, and do nothing else. Two
          questions in one run: the service's own `/constraints` endpoint and
          process description, which is the route that answers; and one
          deliberately invalid value, which proves the request shape is right.
          Fetches nothing, reduces nothing, commits nothing. This is how the
          intermediate release's literal gets settled without guessing it — a
          wrong enum is refused exactly as a misspelt variable name is.
        required: false
        default: false
        type: boolean
      fetch_deadline_sec:
        description: >-
          Stop STARTING CDS jobs after this many seconds. The remainder is
          reported owed, the run exits green with status `incomplete`, and the
          next run asks for exactly those years.
        required: false
        default: "14400"
        type: string
  schedule:
    # The 10th. The consolidated product this producer requests runs 2-3
    # months behind real time and updates monthly, so no day of the month is
    # "too early" for it — what the 10th buys is a fixed slot clear of the
    # ingest chain. (An earlier version of this comment reasoned from ERA5T's
    # five-day lag, which is the lag of a release this producer does not ask
    # for; the figure also disagrees with the dataset page, which is the
    # source to trust.)
    #
    # NOT the 27th or 28th, for the reason haz_backcast.yml documents: crons
    # in this repository are delivered hours late (the 28 Aug 2026 tick
    # arrived 11h41m late) and those two days belong to the monthly ingest
    # and the resolutions chain hanging off it. This workflow holds no DB
    # lock, but a six-hour job competing for runners on the one night the
    # month's scores depend on is a cost with nothing on the other side.
    - cron: "40 5 10 * *"

# contents: write covers the push. No pull-requests scope: there is no
# pull-request route, for the reason the commit step documents.
permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"
  RAW_DIR: spei3_raw
  WINDOW: diagnostics/spei3_window.json
  FETCH_RESULT: diagnostics/spei3_fetch_result.json
  REDUCE_REPORT: diagnostics/spei3_reduce_report.json
  COVERAGE_REPORT: diagnostics/spei3_coverage_report.json
  CANDIDATE: diagnostics/spei3_candidate.csv
  FEED: resolver/data/spei3_country_means.csv
  STATUS: resolver/data/spei3_status.json

jobs:
  # Dispatch only, and deliberately a separate job rather than a branch inside
  # the one below: a probe that shares a job with the producer shares its
  # checkout token, its cache and its commit step, and the whole point is that
  # it can touch none of them. It asks one question and exits.
  probe:
    name: Ask the CDS what an enum accepts
    # One line and an explicit ${{ }}: the shell-sanity lint reads line by
    # line, so a folded `if:` loses the marker that says this is a GitHub
    # expression and not the `A && B || C` shell idiom it exists to reject.
    # Both forms of the boolean are compared, because a dispatch input can
    # arrive as the STRING "false" and every non-empty string is truthy.
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.probe == true || inputs.probe == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # cdsapi alone. The probe needs no scientific stack: it sends a request
      # that will be refused, so there is nothing to open.
      - name: Install the CDS client
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install "$(grep -i '^cdsapi' requirements-spei3.txt)"

      # The route that can actually answer: the CDS's own constraints endpoint
      # and process description. Asked FIRST, because the refusal probe below
      # already came back empty on this dataset (run 34587745561) and the
      # question is what the accepted values ARE.
      - name: Ask the CDS for the accepted values
        env:
          CDSAPI_URL: https://cds.climate.copernicus.eu/api
          CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${CDSAPI_KEY}" ]; then
            echo "::error title=SPEI-3::CDSAPI_KEY is not configured, so the CDS cannot be asked anything"
            exit 1
          fi
          mkdir -p diagnostics
          python -m scripts.build_spei3_country_means describe \
            --key dataset_type \
            --report-out diagnostics/spei3_describe.json 2>&1 \
            | tee diagnostics/spei3_describe.log

      - name: Probe dataset_type
        if: always()
        env:
          CDSAPI_URL: https://cds.climate.copernicus.eu/api
          CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${CDSAPI_KEY}" ]; then
            echo "::error title=SPEI-3::CDSAPI_KEY is not configured, so the CDS cannot be asked anything"
            exit 1
          fi
          mkdir -p diagnostics
          python -m scripts.build_spei3_country_means probe \
            --key dataset_type \
            --report-out diagnostics/spei3_probe.json 2>&1 \
            | tee diagnostics/spei3_probe.log

      - name: Report what the CDS said
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib

          print("## SPEI-3: what the CDS accepts for `dataset_type`\n")

          described = pathlib.Path("diagnostics/spei3_describe.json")
          print("### Asked the CDS's own schema\n")
          if not described.exists():
              print("The describe step wrote no report. Read its step log above.\n")
          else:
              report = json.loads(described.read_text("utf-8"))
              print(f"- settled: **{report.get('settled')}**")
              values = report.get("values") or []
              if values:
                  print(f"- accepted values, via `{report.get('source_route')}`:\n")
                  for value in values:
                      print(f"  - `{value}`")
                  extra = report.get("only_unconstrained") or []
                  if extra:
                      print("\n- valid in general but NOT with the rest of our "
                            "request:\n")
                      blocked = report.get("blocked_by") or {}
                      for value in extra:
                          keys = blocked.get(value) or []
                          if keys:
                              print(f"  - `{value}` — admitted once "
                                    + " or ".join(f"`{k}`" for k in keys)
                                    + " is dropped, so a switch has to vary "
                                      "that rather than replace one constant")
                          else:
                              print(f"  - `{value}` — no single key of ours "
                                    "explains the exclusion, so it is a "
                                    "combination and wants reading first")
                  print("\nTake the intermediate release's literal from that "
                        "list and only then make the switch.\n")
              else:
                  print("- no route named the accepted values. Do not guess "
                        "one.\n")
              print("| route | read | values |")
              print("| --- | --- | --- |")
              for route in report.get("routes") or []:
                  said = ", ".join(f"`{v}`" for v in route.get("values") or [])
                  print(f"| {route.get('route')} | {route.get('ok')} | "
                        f"{said or (route.get('error') or 'named none')} |")
              for route in report.get("routes") or []:
                  excerpt = route.get("excerpt")
                  if excerpt:
                      print(f"\n<details><summary>{route.get('route')}"
                            f"</summary>\n\n```json\n{excerpt}\n```\n"
                            "</details>")

          probed = pathlib.Path("diagnostics/spei3_probe.json")
          print("\n### Sent one deliberately invalid value\n")
          if not probed.exists():
              print("The probe wrote no report. Read its step log above.")
              raise SystemExit(0)
          report = json.loads(probed.read_text("utf-8"))
          print(f"- sent `dataset_type={report.get('sent', {}).get('dataset_type')}`")
          print(f"- refused: **{report.get('refused')}**; settled: "
                f"**{report.get('settled')}**")
          values = report.get("values") or []
          if values:
              print("- accepted values, in the order the CDS listed them:\n")
              for value in values:
                  print(f"  - `{value}`")
          else:
              print("- the refusal named NO accepted values. Expected on this "
                    "dataset, whose validator complains about the whole "
                    "combination rather than one key; what it does prove is "
                    "that every other key in the request was accepted.")
          print(f"\n- what the CDS said:\n\n```\n{report.get('body') or '(nothing)'}\n```")
          PY

      - name: Upload the probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spei3-probe-${{ github.run_id }}
          path: diagnostics/
          retention-days: 30
          if-no-files-found: warn

  refresh:
    # Probe mode asks a question and must not also produce a feed. On a
    # schedule the inner test is false, so this is true and the producer runs.
    if: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.probe == true || inputs.probe == 'true')) }}
    name: Fetch, reduce, gate, commit
    runs-on: ubuntu-latest
    # Under the six-hour job cap with room for the reduce, the gates and the
    # commit after a fetch that spent its whole deadline.
    timeout-minutes: 350
    steps:
      # The token, not the default GITHUB_TOKEN. actions/checkout persists
      # whatever credential it authenticated with, and every later `git push`
      # uses that persisted credential — so checking out with the default and
      # only setting GH_TOKEN in the commit step leaves the push authenticated
      # as GITHUB_TOKEN, which branch protection refuses (GH006) with a message
      # about the rule rather than about the credential. Checking out with the
      # token is what actually makes the push work.
      - name: Check out code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SPEI3_COMMIT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Its own requirements file. Nothing here goes near the resolver's
      # dependency set: the pipeline must not be able to import cdsapi.
      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip wheel setuptools
          pip install -r requirements-spei3.txt

      - name: Prepare diagnostics directory
        run: mkdir -p diagnostics "${RAW_DIR}"

      # What this run owes: the trailing revision window (ERA5T values are
      # revised to final ERA5 later, so the first version of a month is not
      # its last) PLUS every month inside the range the committed CSV does
      # not hold. The second half is what makes the producer self-healing —
      # a month lost to a CDS job that timed out is picked up next cycle with
      # nobody noticing it went missing.
      - name: Plan the window
        env:
          FROM_YM: ${{ inputs.from_ym || '' }}
          TO_YM: ${{ inputs.to_ym || '' }}
          FULL_REBUILD: ${{ github.event_name == 'workflow_dispatch' && (inputs.full_rebuild == true || inputs.full_rebuild == 'true') && 'true' || 'false' }}
        run: |
          set -euo pipefail
          CMD="python -m scripts.build_spei3_country_means plan --out ${FEED} --window-out ${WINDOW}"
          if [ -n "${FROM_YM}" ]; then
            CMD="${CMD} --from ${FROM_YM}"
          fi
          if [ -n "${TO_YM}" ]; then
            CMD="${CMD} --to ${TO_YM}"
          fi
          if [ "${FULL_REBUILD}" = "true" ]; then
            CMD="${CMD} --full-rebuild"
          fi
          ${CMD} 2>&1 | tee diagnostics/spei3_plan.log
          python - <<'PY'
          import json, os
          window = json.load(open(os.environ["WINDOW"]))
          with open(os.environ["GITHUB_ENV"], "a") as fh:
              fh.write(f"SPEI3_MONTHS_OWED={len(window['months'])}\n")
              fh.write(f"SPEI3_YEARS={' '.join(window['years'])}\n")
          PY

      # A monthly cadence against a seven-day cache eviction means the cache
      # essentially never hits between scheduled runs, and that is fine — the
      # committed CSV is the durable artifact and the raw grids are
      # disposable. What the cache IS for is the same-day resumption of a
      # full rebuild whose fetch spent its deadline: without it, run two
      # re-downloads everything run one already had.
      - name: Restore cached raw grids
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.RAW_DIR }}
          key: spei3-raw-v1-${{ github.run_id }}
          restore-keys: |
            spei3-raw-v1-

      # cdsapi reads CDSAPI_URL and CDSAPI_KEY straight from the environment
      # (verified against 0.7.7's get_url_key_verify), so no ~/.cdsapirc is
      # written. That is the better arrangement: no credential on disk, no
      # chmod to get wrong, and nothing for an artifact upload to sweep up.
      #
      # The dataset licence is accepted on the account that owns the token,
      # which is an account-level fact and needs no step here.
      - name: Fetch the grid from the CDS
        env:
          CDSAPI_URL: https://cds.climate.copernicus.eu/api
          CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
          DEADLINE: ${{ inputs.fetch_deadline_sec || '14400' }}
        run: |
          set -euo pipefail
          if [ -z "${CDSAPI_KEY}" ]; then
            echo "::error title=SPEI-3::CDSAPI_KEY is not configured; the producer cannot fetch anything"
            exit 1
          fi
          python -m scripts.build_spei3_country_means fetch \
            --window "${WINDOW}" \
            --raw-dir "${RAW_DIR}" \
            --deadline-sec "${DEADLINE}" \
            --result-out "${FETCH_RESULT}" 2>&1 | tee diagnostics/spei3_fetch.log

      # Reduce against the vendored Natural Earth layer the rest of the
      # machine already uses, then MERGE into a candidate rather than over
      # the feed — so the gates below decide whether it is publishable.
      - name: Reduce to country means and merge
        run: |
          set -euo pipefail
          python -m scripts.build_spei3_country_means reduce \
            --raw-dir "${RAW_DIR}" \
            --window "${WINDOW}" \
            --out "${FEED}" \
            --candidate-out "${CANDIDATE}" \
            --report-out "${REDUCE_REPORT}" 2>&1 | tee diagnostics/spei3_reduce.log

      # Fail closed. Every gate, and the reasons each exists, are in
      # scripts/build_spei3_country_means.py::validate_candidate.
      - name: Gate the candidate
        id: gate
        continue-on-error: true
        run: |
          set -euo pipefail
          python -m scripts.build_spei3_country_means validate \
            --candidate "${CANDIDATE}" \
            --against "${FEED}" \
            --window "${WINDOW}" \
            --reduce-report "${REDUCE_REPORT}" \
            --fetch-result "${FETCH_RESULT}" \
            --report-out "${COVERAGE_REPORT}" 2>&1 | tee diagnostics/spei3_validate.log

      # Promote, or record the failure. Either way the status file is written:
      # a feed that quietly stops extending is what an unattended system is
      # worst at noticing, and the register's staleness check reads this file.
      - name: Promote the candidate or record the failure
        env:
          GATE: ${{ steps.gate.outcome }}
        run: |
          set -euo pipefail
          if [ "${GATE}" = "success" ]; then
            python -m scripts.build_spei3_country_means promote \
              --candidate "${CANDIDATE}" \
              --out "${FEED}" \
              --status-out "${STATUS}" \
              --window "${WINDOW}" \
              --fetch-result "${FETCH_RESULT}" \
              --run-id "${GITHUB_RUN_ID}" 2>&1 | tee diagnostics/spei3_promote.log
          else
            echo "::error title=SPEI-3::a validation gate failed; the committed feed is unchanged. See the spei3-candidate artifact."
            python -m scripts.build_spei3_country_means promote \
              --failed \
              --failure-reason "a validation gate failed (see diagnostics/spei3_validate.log)" \
              --out "${FEED}" \
              --status-out "${STATUS}" \
              --window "${WINDOW}" \
              --fetch-result "${FETCH_RESULT}" \
              --run-id "${GITHUB_RUN_ID}" 2>&1 | tee diagnostics/spei3_promote.log
          fi

      # The raw grids are disposable and the CSV is the durable artifact, so
      # the cache keeps only what a resumption needs: everything while years
      # are still owed, the trailing two years otherwise (the 10 GB
      # repository cap defeats anything larger).
      - name: Prune the raw grids before caching
        run: |
          set -euo pipefail
          OWED=$(python -c "import json,os;print(len(json.load(open(os.environ['FETCH_RESULT'])).get('years_owed') or []))")
          if [ "${OWED}" != "0" ]; then
            echo "keeping every downloaded year: ${OWED} still owed, so the next run resumes on them"
          else
            KEEP_A=$(date -u +%Y)
            KEEP_B=$(( KEEP_A - 1 ))
            # Prefix match: the CDS serves a zip and the unpacked members
            # are named spei3_<year>__<member>.nc, so an exact-name test
            # would delete every year it meant to keep.
            find "${RAW_DIR}" -name '*.nc' \
              ! -name "spei3_${KEEP_A}*" ! -name "spei3_${KEEP_B}*" -delete
            echo "kept ${KEEP_A} and ${KEEP_B} only"
          fi
          du -sh "${RAW_DIR}" || true

      - name: Save cached raw grids
        uses: actions/cache/save@v4
        if: always()
        with:
          path: ${{ env.RAW_DIR }}
          key: spei3-raw-v1-${{ github.run_id }}

      # Commit whatever actually changed. On a failed gate that is the status
      # file alone, which is the point: the failure is recorded even though
      # the feed is not touched.
      #
      # Straight to main, with SPEI3_COMMIT_TOKEN. There is no pull-request
      # fallback and there deliberately is not one: a pull request opened by
      # GITHUB_TOKEN does not trigger workflows — GitHub suppresses that on
      # purpose, to stop workflows spawning workflows — so with branch
      # protection requiring CI and Lint, the checks on such a pull request
      # never start and it can never merge. A click a month would become a
      # stuck pull request a month, which is worse, because a stuck pull
      # request looks like progress.
      #
      # No branch and no review step either. The gates fail closed and are
      # stricter than a reviewer: they refuse a candidate whose values fall
      # outside +/-6 sigma, whose requested months are absent without a
      # stated reason, or which loses countries or rows against the feed it
      # replaces. Run 34461670816 is the proof — it caught twelve saturating
      # values and left the committed feed exactly as it was.
      #
      # When the secret is missing the run FAILS naming it. Falling back to
      # anything else would put the producer back where it started while
      # reporting success.
      # When the secret is missing, or the push is refused, the run FAILS —
      # but it fails through one of the named steps BELOW rather than here,
      # and that is the whole point. A refused push cannot commit the record
      # of its own refusal, so the only durable account of it is this run,
      # and the register reads the failing STEP NAME off the Actions API.
      # The names are a contract with
      # resolver/diagnostics/producer_commit.py::STEP_BY_CLASS; a test holds
      # this file to them, because renaming one here would silently blind the
      # guard rather than break it.
      #
      # So this step classifies and exits 0. A transport failure earns up to
      # four attempts with exponential backoff (this repository's own rule); a
      # refused credential earns exactly one, because retrying a refusal
      # spends three more requests to be told the same thing.
      - name: Commit the feed
        id: commit
        env:
          COMMIT_TOKEN: ${{ secrets.SPEI3_COMMIT_TOKEN }}
        run: |
          set -uo pipefail
          if [ -z "${COMMIT_TOKEN}" ]; then
            echo "class=no_secret" >> "$GITHUB_OUTPUT"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Add only what exists. On a failed gate `promote --failed`
          # deliberately writes the status file and leaves the feed alone, so
          # a bare `git add -- "${FEED}" "${STATUS}"` aborts with exit 128 on
          # a pathspec matching nothing — which is how run 34461670816 went
          # red at the commit rather than at the gate that actually failed,
          # taking the gate's own error message with it.
          for path in "${FEED}" "${STATUS}"; do
            if [ -e "${path}" ]; then
              git add -- "${path}"
            fi
          done
          if git diff --cached --quiet; then
            echo "nothing changed: the feed already covers this window"
            echo "class=ok" >> "$GITHUB_OUTPUT"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          # The body carries what the commit actually did to the feed, so
          # `git log -- resolver/data/` reads as a history of the series
          # rather than a list of run ids: rows, the range covered, and the
          # restale token the nightly backcast will consume.
          python - <<'PY' > /tmp/spei3_commit_msg.txt
          import json, os
          status = json.load(open(os.environ["STATUS"]))
          restale = status.get("restale") or {}
          newest = status.get("newest_month") or "?"
          print(f"SPEI-3 feed: covered through {newest}")
          print()
          print(f"rows:     {status.get('rows', 0):,}")
          print(f"months:   {status.get('months', 0)} "
                f"({status.get('oldest_month', '?')}..{newest})")
          print(f"countries:{status.get('countries', 0):>4}")
          print(f"state:    {status.get('status', 'unknown')}")
          owed = status.get("months_owed") or []
          if owed:
              print(f"owed:     {len(owed)} month(s): {','.join(owed[:12])}")
          if restale:
              print(f"restale:  {restale.get('token')} "
                    f"({len(restale.get('months') or [])} {restale.get('hazard', '?')} month(s))")
          print()
          print(f"Produced by spei3_refresh.yml run {os.environ['GITHUB_RUN_ID']}.")
          PY
          cat /tmp/spei3_commit_msg.txt
          git commit -F /tmp/spei3_commit_msg.txt
          set +e
          # Rebase onto whatever landed while the fetch and reduce ran; a
          # six-hour job is long enough for main to move under it, and the
          # only files this commit touches are ones nothing else writes.
          CLASS=""
          for attempt in 1 2 3 4; do
            OUT=$( { git pull --rebase --autostash origin "${GITHUB_REF_NAME}" \
                       && git push origin "HEAD:${GITHUB_REF_NAME}"; } 2>&1 )
            RC=$?
            echo "${OUT}"
            if [ "${RC}" = "0" ]; then
              CLASS="ok"
              break
            fi
            CLASS=$(printf '%s' "${OUT}" \
              | python -m resolver.diagnostics.producer_commit --classify)
            # A classifier that itself fell over must never read as success:
            # an empty class fires no step below, so the run would go green
            # having pushed nothing, which is the one outcome this whole
            # arrangement exists to make impossible.
            if [ -z "${CLASS}" ]; then
              CLASS="refused_other"
            fi
            echo "attempt ${attempt}: push failed, classified as ${CLASS}"
            if [ "${CLASS}" != "refused_network" ]; then
              break
            fi
            sleep $(( 2 ** attempt ))
          done
          echo "class=${CLASS}" >> "$GITHUB_OUTPUT"
          if [ "${CLASS}" = "ok" ]; then
            echo "pushed=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Upload the candidate and the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spei3-candidate-${{ github.run_id }}
          path: |
            diagnostics/
          retention-days: 30
          if-no-files-found: warn

      - name: Summarise
        if: always()
        env:
          GATE: ${{ steps.gate.outcome }}
          CHANGED: ${{ steps.commit.outputs.changed }}
          PUSHED: ${{ steps.commit.outputs.pushed }}
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os, pathlib

          def load(key):
              path = pathlib.Path(os.environ.get(key, ""))
              if not path.exists():
                  return {}
              try:
                  return json.loads(path.read_text("utf-8"))
              except ValueError:
                  return {}

          window, fetch = load("WINDOW"), load("FETCH_RESULT")
          coverage, status = load("COVERAGE_REPORT"), load("STATUS")
          gate = os.environ.get("GATE", "")
          print("## SPEI-3 feed refresh\n")
          print(f"- gate: **{gate}**; committed: {os.environ.get('CHANGED') or 'false'}"
                f" ({os.environ.get('PUSHED') or 'nothing pushed'})")
          print(f"- window: {len(window.get('months') or [])} month(s) across "
                f"year(s) {', '.join(window.get('years') or []) or 'none'}")
          print(f"- fetched: {len(fetch.get('written') or [])} year(s), "
                f"{(fetch.get('bytes_downloaded') or 0) / 1e6:.1f} MB; "
                f"owed: {', '.join(fetch.get('years_owed') or []) or 'none'}")
          print(f"- feed now covers {status.get('oldest_month', '?')}.."
                f"{status.get('newest_month', '?')} "
                f"({status.get('months', 0)} month(s), {status.get('rows', 0)} row(s), "
                f"{status.get('countries', 0)} country/countries); "
                f"status **{status.get('status', 'unknown')}**")
          restale = status.get("restale") or {}
          if restale:
              print(f"- restale requested for {len(restale.get('months') or [])} "
                    f"DR month(s), token `{restale.get('token')}` — the nightly "
                    "backcast applies it")
          for failure in coverage.get("failures") or []:
              print(f"- **gate failed**: {failure}")
          for warning in coverage.get("warnings") or []:
              print(f"- warning: {warning}")
          PY

      # The class of a failed commit, carried out of this run by the NAME of
      # the step that fails. A refused push cannot commit the record of its
      # own refusal, so the run itself is the only durable account and the
      # register reads these names off the Actions API
      # (resolver/diagnostics/producer_commit.py::STEP_BY_CLASS, which a test
      # holds this file to). They sit below the artifact upload and the
      # summary on purpose, so a refusal still leaves its evidence behind.
      #
      # Only the credential class reaches the register, and only at
      # `degraded`. A transport failure is a retry rather than a rotation and
      # must not cry wolf; an absent secret is a red run with its own named
      # error, which is where it belongs.
      - name: "Fail: SPEI3_COMMIT_TOKEN is not configured"
        if: always() && steps.commit.outputs.class == 'no_secret'
        run: |
          echo "::error title=SPEI-3::SPEI3_COMMIT_TOKEN is not configured, so the feed cannot be committed and this run has produced nothing durable. It needs a fine-grained token with Contents: read and write on this repository, and the ability to bypass branch protection on the default branch. See the header of .github/workflows/spei3_refresh.yml."
          exit 1

      - name: "Fail: SPEI3_COMMIT_TOKEN was refused"
        if: always() && steps.commit.outputs.class == 'refused_auth'
        run: |
          echo "::error title=SPEI-3::the push was REFUSED for an authentication or permission reason, so the SPEI-3 feed has stopped extending. SPEI3_COMMIT_TOKEN has been revoked, had its permissions narrowed, or lost access to this repository. It needs Contents: read and write plus the ability to bypass branch protection on the default branch. Until it is rotated the drought gate loses its only observation of the months before the HDX and NMME ingests began, one month per cycle."
          exit 1

      - name: "Fail: the push could not reach GitHub"
        if: always() && steps.commit.outputs.class == 'refused_network'
        run: |
          echo "::error title=SPEI-3::the push could not reach GitHub after four attempts. This is a transport failure rather than a credential problem, so the remedy is to re-run this workflow: nothing was lost, and the next run re-plans exactly the window it still owes."
          exit 1

      - name: "Fail: the commit failed for an unread reason"
        if: always() && steps.commit.outputs.class == 'refused_other'
        run: |
          echo "::error title=SPEI-3::the commit failed and the failure matched neither a credential refusal nor a transport error. Read the Commit the feed step's log: this is a class resolver/diagnostics/producer_commit.py does not yet recognise, and guessing which of the two it is would either retry a bug or send somebody to rotate a working credential."
          exit 1

      # Green when a CDS job is still queued: that is not a fault, and a red
      # run there is indistinguishable from a broken request. Red when a gate
      # failed, because a candidate the machine refused to publish is
      # something a person has to look at.
      # always(), not the default: without it a failure in any step above —
      # the commit, say — skips this one and the run goes red carrying that
      # step's message instead of the gate's. The gate is the thing a reader
      # needs to be told about, so it says so whatever else went wrong.
      - name: Fail if a gate failed
        if: always() && steps.gate.outcome != 'success'
        run: |
          set -euo pipefail
          echo "::error::the SPEI-3 candidate failed its validation gates; the committed feed is unchanged"
          exit 1
