---
name: CrisisWatch CI

# Tests for the CrisisWatch refresh script (Wayback acquisition path).
# Deliberately installs ONLY the minimal packages the refresh workflow
# installs (requests, beautifulsoup4, PyYAML) so a new heavy import in
# the script/module chain breaks THIS workflow instead of silently
# breaking the monthly refresh.
"on":
  push:
    paths:
      - "scripts/refresh_crisiswatch.py"
      - "horizon_scanner/crisiswatch.py"
      - "tests/test_refresh_crisiswatch.py"
      - "horizon_scanner/tests/test_crisiswatch_regional_merge.py"
      - "scripts/ci/crisiswatch_publication_days.py"
      - "tests/test_crisiswatch_publication_days.py"
      - "scripts/ci/crisiswatch_edition_gate.py"
      - "scripts/ci/tests/test_crisiswatch_edition_gate.py"
      - "tests/fixtures/crisiswatch_*"
      - ".github/workflows/crisiswatch-ci.yml"
      - ".github/workflows/refresh-crisiswatch.yml"
  pull_request:
    paths:
      - "scripts/refresh_crisiswatch.py"
      - "horizon_scanner/crisiswatch.py"
      - "tests/test_refresh_crisiswatch.py"
      - "horizon_scanner/tests/test_crisiswatch_regional_merge.py"
      - "scripts/ci/crisiswatch_publication_days.py"
      - "tests/test_crisiswatch_publication_days.py"
      - "scripts/ci/crisiswatch_edition_gate.py"
      - "scripts/ci/tests/test_crisiswatch_edition_gate.py"
      - "tests/fixtures/crisiswatch_*"
      - ".github/workflows/crisiswatch-ci.yml"
      - ".github/workflows/refresh-crisiswatch.yml"
  workflow_dispatch: {}

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  crisiswatch-tests:
    name: CrisisWatch refresh tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install minimal dependencies (mirrors refresh workflow)
        run: |
          python -m pip install --upgrade pip
          pip install "requests>=2.32,<3" "beautifulsoup4>=4.12,<5" "PyYAML>=6.0,<7"
          pip install pytest pytest-timeout

      - name: Run CrisisWatch refresh tests
        # The merge test guards the contract BETWEEN the two files this
        # workflow triggers on: the scraper stamps regional_source, the loader
        # reads it. horizon-scanner-ci runs it too (it sweeps horizon_scanner/),
        # but it does not trigger on scripts/refresh_crisiswatch.py, so a
        # scraper-only change would re-run nothing that covers the contract.
        run: |
          pytest -vv \
            tests/test_refresh_crisiswatch.py \
            tests/test_crisiswatch_publication_days.py \
            scripts/ci/tests/test_crisiswatch_edition_gate.py \
            horizon_scanner/tests/test_crisiswatch_regional_merge.py

  # TEMPORARY (PR 1 of the October 2026 review): the publication-day
  # measurement needs archive.org, which only a runner can reach. Removed
  # before merge; the permanent route is refresh-crisiswatch.yml's
  # measure_publication_days input.
  measure-publication-days:
    name: Measure CrisisWatch publication days (temporary)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "requests>=2.32,<3" "beautifulsoup4>=4.12,<5" "PyYAML>=6.0,<7"
      - name: Measure
        env:
          RELIEFWEB_APPNAME: ${{ secrets.RELIEFWEB_APPNAME }}
        run: python -m scripts.ci.crisiswatch_publication_days
      - name: Does a per-edition page parse like the main page? (temporary)
        run: |
          python - <<'PY'
          import requests
          from scripts import refresh_crisiswatch as rc
          for slug, ts in [
              ("september-trends-and-october-alerts-2025", "20251005"),
              ("may-trends-and-june-alerts-2026", "20260601"),
          ]:
              url = f"https://web.archive.org/web/{ts}id_/https://www.crisisgroup.org/crisiswatch/{slug}"
              try:
                  r = requests.get(url, timeout=90, headers={"User-Agent": rc._WAYBACK_USER_AGENT})
                  html = rc._maybe_gunzip(r.content).decode("utf-8", "replace")
                  print(slug, "HTTP", r.status_code, "final", r.url, "len", len(html),
                        "entries", html.count("c-crisiswatch-entry"))
                  if html.count("c-crisiswatch-entry") >= 20:
                      d = rc.parse_edition(html, provenance="probe")
                      print("  parsed edition:", d.get("month"), "entries:", len(d.get("entries", [])))
              except Exception as exc:
                  print(slug, "failed:", exc)
              # Is the live page still there? (SPN would capture it.)
              try:
                  r = requests.get(f"https://www.crisisgroup.org/crisiswatch/{slug}", timeout=60,
                                   headers={"User-Agent": rc._USER_AGENT})
                  print("  live:", r.status_code, len(r.content))
              except Exception as exc:
                  print("  live failed:", exc)
          PY
