---
name: Resolver Update

concurrency:
  group: pythia-resolver-db
  cancel-in-progress: false

"on":
  workflow_dispatch:
    inputs:
      months_back:
        description: "ACLED/IDMC backfill window in months (does NOT affect FEWS NET / IPC API / GDACS — those have their own inputs below)"
        required: true
        default: "3"
      reset_db:
        description: "Delete existing resolver.duckdb and rebuild from scratch?"
        required: false
        default: false
        type: boolean
      only_connector:
        description: >-
          Optional: run only these connectors (comma-separated).
          Core: acled_client, idmc, ifrc_go_client.
          Resolution: fewsnet_ipc (see fewsnet_months), ipc_api (see ipc_api_months), gdacs (see gdacs_months).
          Structured: conflict (views+cf+cast), acaps, reliefweb, acled_political, nmme, gdelt.
          Context: enso, seasonal_tc, hdx_signals, crisiswatch.
          Leave empty to run all. Examples: "gdacs" or "gdacs, fewsnet_ipc".
        required: false
        default: ""
      log_level:
        description: "Log level (DEBUG, INFO, WARNING, ERROR)"
        required: false
        default: "INFO"
        type: choice
        options:
          - DEBUG
          - INFO
          - WARNING
          - ERROR
      empty_policy:
        description: "What to do when a connector writes 0 rows? (allow|warn|fail)"
        required: false
        default: "allow"
        type: choice
        options:
          - allow
          - warn
          - fail
      gdacs_months:
        description: "Months of GDACS data to fetch (default 3; use 135 for full backfill to 2015)"
        required: false
        default: "3"
        type: string
      fewsnet_months:
        description: "Months of FEWS NET IPC data to fetch (default 12; 120 for full backfill to 2016). Leave the default: short windows only see countries with a recent analysis cycle."
        required: false
        default: "12"
        type: string
      ipc_api_months:
        description: "Months of IPC API data to fetch (default 24 — IPC analyses are infrequent; 120 for full backfill). Leave the default: short windows only see countries with a recent analysis."
        required: false
        default: "24"
        type: string
  schedule:
    # Run at 03:00 UTC on the 28th of each month.
    #
    # Deliberately just BEFORE the forecast pipeline's 1st-of-month cron
    # (pythia_pipeline_stage.yml), not two weeks after it. This workflow is the
    # only refresh for the tier-0 resolution sources (ACLED monthly fatalities,
    # IFRC, IDMC, FEWS NET / IPC) — the weekly ingest-structured-data.yml run
    # covers only the fast-changing supplementary sources. While this ran on the
    # 15th, every monthly forecast reasoned over core data ~17 days stale (the
    # 2026-08-01 run carried a 2026-07-15 ingest vintage).
    #
    # The 28th also puts the resolutions -> scores -> calibration chain that
    # hangs off this workflow immediately before the forecast that consumes its
    # calibration weights. Cost of the move, accepted knowingly: each month's
    # ground truth is resolved ~13 days later than under the 15th cadence.
    #
    # Do not move this back past the 1st without re-reading the above.
    - cron: "0 3 28 * *"

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: "1"
  BACKFILL_DB_PATH: data/resolver.duckdb
  SIGNATURE_REQUIRED_TABLES: questions,hs_triage,question_research,forecasts_ensemble,llm_calls,facts_resolved,facts_deltas,acled_monthly_fatalities
  # haz_* tables are optional: they exist only once the PA resolution machine
  # (Phase 2.5) has run at least once, and pre-machine DBs must still pass.
  SIGNATURE_OPTIONAL_TABLES: scenarios,hdx_signals,enso_state,seasonal_tc_outlooks,seasonal_tc_context_cache,haz_triggers,haz_resolutions,haz_base_rates_occurrence,haz_base_rates_severity

jobs:
  backfill:
    name: Full pipeline backfill
    runs-on: ubuntu-latest
    # Self-imposed budget (GitHub's hard cap is 360 min/job on hosted runners).
    # Reset/backfill runs pull 10+ years of GDACS + 12 months of ACLED and need
    # far more headroom than the scheduled monthly incremental run. The
    # non-reset budget rose 150 -> 240 when Phase 2.5 (the PA resolution
    # machine) was added: its ReliefWeb silence sweeps are paced at ~0.5 s per
    # country and cover ~250 countries x 3 trailing months per hazard, which
    # is 60-90 min of deliberate patience, not slack to trim. It rose again
    # 240 -> 330 (reset 300 -> 350) on 2026-08-26: worst-case step budgets
    # (Phase 1 connectors 70 + monthly fatalities ~30, Phase 2 ~30, Phase 2.5
    # 60+75+20+15, Phase 3 30, Phase 4 15, Phase 5 + canonical download tails)
    # sum past 240, and a job-timeout kill BEFORE the Phase 5 canonical upload
    # wastes the entire ingest — the job must always reach that upload.
    timeout-minutes: ${{ inputs.reset_db && 350 || 330 }}
    env:
      RESOLVER_DB_URL: ${{ secrets.RESOLVER_DUCKDB_URL != '' && secrets.RESOLVER_DUCKDB_URL || format('duckdb:///{0}/data/resolver.duckdb', github.workspace) }}
      PYTHIA_DB_URL: duckdb:///${{ github.workspace }}/data/resolver.duckdb
      ACLED_REFRESH_TOKEN: ${{ secrets.ACLED_REFRESH_TOKEN }}
      ACLED_USERNAME: ${{ secrets.ACLED_USERNAME }}
      ACLED_PASSWORD: ${{ secrets.ACLED_PASSWORD }}
      ACLED_ACCESS_KEY: ${{ secrets.ACLED_ACCESS_KEY }}
      IDMC_API_TOKEN: ${{ secrets.IDMC_API_TOKEN }}
      IDMC_REQ_PER_SEC: 0.3
      IDMC_MAX_CONCURRENCY: 1
      IDMC_ALLOW_HDX_FALLBACK: "1"
      IDMC_HDX_PACKAGE_ID: preliminary-internal-displacement-updates
      ONLY_CONNECTOR: ${{ inputs.only_connector }}
      RESOLVER_OUTPUT_DIR: resolver/staging
      LOG_LEVEL: ${{ inputs.log_level }}
      EMPTY_POLICY: ${{ inputs.empty_policy }}
      IDMC_HELIX_CLIENT_ID: ${{ secrets.IDMC_HELIX_CLIENT_ID }}
      IDMC_HELIX_ENV: RELEASE
      RESOLVER_EXPORT_ENABLE_FLOW: "1"
      ACAPS_USERNAME: ${{ secrets.ACAPS_USERNAME }}
      ACAPS_PASSWORD: ${{ secrets.ACAPS_PASSWORD }}
      IPC_API_KEY: ${{ secrets.IPC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      EMDAT_API_KEY: ${{ secrets.EMDAT_API_KEY }}
      # --- PA resolution machine (Phase 2.5) ---
      # ANTHROPIC_API_KEY backs the hazard_extraction role (ladder rung 2,
      # Haiku-class transcription). RELIEFWEB_APPNAME identifies the silence
      # sweep + document fetches to ReliefWeb (code falls back to
      # 'pythia-resolution-machine' with a warning when unset). IDMC_API_KEY is
      # the IDU key sent as client_id — a DIFFERENT credential from
      # IDMC_API_TOKEN (the HELIX token above); when the secret is unset the
      # IDU lower-bound rung reports UNAVAILABLE, which the rows record.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      RELIEFWEB_APPNAME: ${{ secrets.RELIEFWEB_APPNAME }}
      IDMC_API_KEY: ${{ secrets.IDMC_API_KEY }}
      FEWSNET_MONTHS: ${{ inputs.reset_db && '120' || inputs.fewsnet_months || '12' }}
      IPC_API_MONTHS: ${{ inputs.reset_db && '120' || inputs.ipc_api_months || '24' }}
      GDACS_MONTHS: ${{ inputs.reset_db && '135' || inputs.gdacs_months || '3' }}
      DIAGNOSTICS_REPORT_PATH: diagnostics/ingestion/connectors_report.jsonl
      # Run-scoped evidence streams: outbound HTTP (URL, status, timing,
      # response envelope) and the machine's per-cell and per-figure ledgers.
      # Setting this is what turns recording ON — the code default is off, so
      # a local run and every test are unaffected. The debug bundle reads
      # these; without them it can report what the logs say and no more.
      PYTHIA_RUN_LOG_DIR: diagnostics/run_log

    steps:
      # === SETUP ===
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip wheel setuptools
          pip install -c constraints-ci.txt -e '.[db,ingestion]'

      - name: Compute backfill window
        id: window
        env:
          MONTHS_INPUT: ${{ inputs.months_back || '3' }}
          TIMEZONE: Europe/Istanbul
        run: |
          set -euo pipefail
          if [ "${LOG_LEVEL:-INFO}" = "DEBUG" ]; then
            set -x
          fi
          python -m scripts.ci.compute_backfill_window

      # Surface the effective ingest windows at the top of the step summary so
      # non-default dispatch inputs (e.g. fewsnet_months=3) are never invisible
      # — a short FEWS NET/IPC window only sees countries with a recent
      # analysis cycle.
      - name: Echo effective ingest windows
        run: |
          FEWSNET_NOTE=""
          if [ "${FEWSNET_MONTHS}" -lt 12 ] 2>/dev/null; then
            FEWSNET_NOTE=" ⚠️ below default 12 — partial country coverage in this window"
          fi
          IPC_NOTE=""
          if [ "${IPC_API_MONTHS}" -lt 24 ] 2>/dev/null; then
            IPC_NOTE=" ⚠️ below default 24 — partial country coverage in this window"
          fi
          {
            echo "### Effective ingest windows"
            echo ""
            echo "| Setting | Value |"
            echo "| --- | --- |"
            echo "| ACLED/IDMC window | ${{ steps.window.outputs.start_iso }} → ${{ steps.window.outputs.end_iso }} (months_back=${MONTHS_BACK_IN:-3}) |"
            echo "| FEWSNET_MONTHS | ${FEWSNET_MONTHS}${FEWSNET_NOTE} |"
            echo "| IPC_API_MONTHS | ${IPC_API_MONTHS}${IPC_NOTE} |"
            echo "| GDACS_MONTHS | ${GDACS_MONTHS} |"
            echo "| reset_db | ${{ inputs.reset_db }} |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          MONTHS_BACK_IN: ${{ inputs.months_back }}

      # Canonical discovery via the shared composite action (single home of
      # the candidate list). Per-candidate signature validation rejects DBs
      # missing required tables before they are accepted.
      - name: Download canonical resolver DB for incremental runs
        id: canonical_download
        if: github.event_name != 'workflow_dispatch' || !inputs.reset_db
        uses: ./.github/actions/download-canonical-db
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          validate-cmd: >-
            mkdir -p diagnostics &&
            python -m scripts.ci.db_signature write
            --db data/resolver.duckdb
            --required "${SIGNATURE_REQUIRED_TABLES}"
            --optional "${SIGNATURE_OPTIONAL_TABLES}"
            --all-tables
            --out diagnostics/db_signature_before.json

      - name: Record canonical DB provenance
        if: github.event_name != 'workflow_dispatch' || !inputs.reset_db
        env:
          FOUND_LABEL: ${{ steps.canonical_download.outputs.source }}
          FOUND_RUN_ID: ${{ steps.canonical_download.outputs.run-id }}
          FOUND_CREATED_AT: ${{ steps.canonical_download.outputs.created-at }}
        run: |
          set -euo pipefail
          case "${FOUND_LABEL}" in
            "Horizon Scanner Triage") SOURCE_KIND="pipeline" ;;
            "Ingest Structured Data") SOURCE_KIND="ingest" ;;
            "Pythia — Compute Calibration Weights & Advice"|"Pythia — Compute SPD Scores"|"Pythia — Compute Resolutions") SOURCE_KIND="calibration" ;;
            *) SOURCE_KIND="backfill" ;;
          esac
          {
            echo "CANONICAL_DB_READY=true"
            echo "CANONICAL_DB_SOURCE=${SOURCE_KIND}"
            echo "CANONICAL_DB_RUN_ID=${FOUND_RUN_ID}"
            echo "CANONICAL_CREATED_AT=${FOUND_CREATED_AT}"
          } >> "$GITHUB_ENV"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              echo "### Canonical DB signature (before run)"
              echo "- Source: ${SOURCE_KIND} (run ${FOUND_RUN_ID})"
              echo "- Created: ${FOUND_CREATED_AT}"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Remove existing resolver.duckdb (reset mode only)
        if: github.event_name == 'workflow_dispatch' && inputs.reset_db
        run: |
          set -euo pipefail
          rm -f data/resolver.duckdb
          echo "CANONICAL_DB_READY=false" >> "$GITHUB_ENV"

      - name: Ensure schema
        run: |
          set -euo pipefail
          mkdir -p data
          python -c "from pythia.db.schema import ensure_schema; ensure_schema()"

      - name: Prepare diagnostics directories
        run: |
          set -euo pipefail
          mkdir -p diagnostics/ingestion/{logs,raw,metrics,samples,export_preview}
          mkdir -p diagnostics/run_log
          echo "PYTHIA_RUN_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      # === PHASE 1: RESOLVER CONNECTORS (ground truth — fatal) ===
      - name: "Phase 1: Run IDMC (HELIX)"
        if: ${{ inputs.only_connector == '' || contains(inputs.only_connector, 'idmc') }}
        run: |
          set -euo pipefail
          echo "::group::IDMC (HELIX)"
          python -m resolver.ingestion.idmc.cli \
            --network-mode helix \
            --series flow \
            --enable-export \
            --write-outputs \
            --start "${{ steps.window.outputs.start_iso }}" \
            --end   "${{ steps.window.outputs.end_iso }}" \
            --debug

          # Emit IDMC diagnostics line from its summary.json
          python -c "
          import json, os
          from pathlib import Path
          report_path = os.environ.get('DIAGNOSTICS_REPORT_PATH')
          if not report_path:
              exit(0)
          try:
              from resolver.ingestion.diagnostics_emitter import start_run, finalize_run, append_jsonl
          except ImportError:
              exit(0)
          summary_path = Path('diagnostics/ingestion/idmc/summary.json')
          ctx = start_run('idmc_helix', 'real')
          if summary_path.exists():
              summary = json.loads(summary_path.read_text())
              counts = summary.get('counts', {})
              status = 'ok' if counts.get('written', 0) > 0 else 'error'
              reason = None if status == 'ok' else 'zero-rows-written'
              result = finalize_run(ctx, status, reason=reason, counts={
                  'fetched': counts.get('fetched', 0),
                  'normalized': counts.get('normalized', 0),
                  'written': counts.get('written', 0),
              })
          else:
              result = finalize_run(ctx, 'error', reason='summary.json not found')
          append_jsonl(report_path, result)
          " || true
          echo "::endgroup::"

      - name: "Phase 1: Run connectors (ACLED, IFRC)"
        env:
          RESOLVER_START_ISO: ${{ steps.window.outputs.start_iso }}
          RESOLVER_END_ISO: ${{ steps.window.outputs.end_iso }}
          BACKFILL_START_ISO: ${{ steps.window.outputs.start_iso }}
          BACKFILL_END_ISO: ${{ steps.window.outputs.end_iso }}
          RESOLVER_SKIP_IDMC: "1"
          # Reset runs use a ~12-month window (vs 3 months scheduled) — the
          # 2026-07-08 reset run hit the 1500s deadline at page 77 and wrote
          # silently-truncated monthly aggregates. Scale both budgets up so a
          # full-window pull (~35 min observed) completes.
          CONNECTOR_TIMEOUT: ${{ inputs.reset_db && '4200' || '1800' }}
          # Graceful ACLED deadline below the hard wrapper so a slow/huge pull
          # returns partial rows (rc=0) instead of being SIGKILLed (rc=124).
          ACLED_MAX_RUNTIME_SEC: ${{ inputs.reset_db && '3900' || '1500' }}
        if: ${{ inputs.only_connector == '' || contains(inputs.only_connector, 'acled_client') || contains(inputs.only_connector, 'ifrc_go_client') }}
        # CONNECTOR_TIMEOUT is applied PER CONNECTOR by run_connectors.py, and
        # two live connectors run here (ACLED + IFRC; IDMC is skipped via
        # RESOLVER_SKIP_IDMC) — so the step budget must exceed 2x it: non-reset
        # 2x1800 s = 60 min -> 70. The reset arm (90 < 2x4200 s) leans on
        # ACLED_MAX_RUNTIME_SEC=3900 returning partial rows early and the
        # observed ~35-min reset pulls.
        timeout-minutes: ${{ inputs.reset_db && 90 || 70 }}
        run: |
          set -euo pipefail
          echo "::group::Connectors (ACLED, IFRC)"
          mkdir -p diagnostics/ingestion/{logs,raw,metrics,samples,export_preview}
          mkdir -p "$(dirname "${BACKFILL_DB_PATH}")"
          python -m scripts.ci.run_connectors
          echo "::endgroup::"

      - name: "Phase 1: ACLED monthly fatalities → DuckDB"
        if: ${{ inputs.only_connector == '' || contains(inputs.only_connector, 'acled_client') }}
        timeout-minutes: ${{ inputs.reset_db && 60 || 30 }}
        env:
          BACKFILL_START_ISO: ${{ steps.window.outputs.start_iso }}
          BACKFILL_END_ISO: ${{ steps.window.outputs.end_iso }}
        run: |
          set -euo pipefail
          echo "::group::ACLED monthly fatalities"
          mkdir -p diagnostics/acled
          # --events-file reuses the raw events the connector step just staged
          # (single ACLED pull per run). Falls back to a fresh API fetch when
          # the file is missing, truncated, or doesn't cover the window.
          python -m resolver.cli.acled_to_duckdb \
            --start "${BACKFILL_START_ISO}" \
            --end "${BACKFILL_END_ISO}" \
            --db "${BACKFILL_DB_PATH}" \
            --events-file resolver/staging/acled_events_raw.csv \
            --log-level "${LOG_LEVEL}" \
            2>&1 | tee diagnostics/acled/acled_to_duckdb.log
          echo "::endgroup::"

      - name: "Phase 1: Normalize + load_and_derive → facts_resolved"
        if: ${{ inputs.only_connector == '' || contains(inputs.only_connector, 'idmc') || contains(inputs.only_connector, 'acled_client') || contains(inputs.only_connector, 'ifrc_go_client') }}
        env:
          BACKFILL_START_ISO: ${{ steps.window.outputs.start_iso }}
          BACKFILL_END_ISO: ${{ steps.window.outputs.end_iso }}
        run: |
          set -euo pipefail
          echo "::group::Normalize and load_and_derive"
          PERIOD_LABEL="$(python -c "
          import os, datetime as dt
          s = os.environ.get('BACKFILL_START_ISO','')
          e = os.environ.get('BACKFILL_END_ISO','')
          if s and e:
              sd = dt.date.fromisoformat(s[:10])
              ed = dt.date.fromisoformat(e[:10])
              sq = (sd.month-1)//3+1
              eq = (ed.month-1)//3+1
              if sd.year==ed.year and sq==eq:
                  print(f'{sd.year}Q{sq}')
              else:
                  print(f'{s[:10]}_{e[:10]}')
          else:
              print('unknown')
          ")"

          CANONICAL_DIR="resolver/staging/${PERIOD_LABEL}/canonical"
          mkdir -p "${CANONICAL_DIR}"
          python -m resolver.transform.normalize \
            --in resolver/staging \
            --out "${CANONICAL_DIR}" \
            --sources ifrc_go,acled,idmc \
            --period "${PERIOD_LABEL}" \
            --log-level "${LOG_LEVEL:-INFO}"

          python -m resolver.tools.load_and_derive \
            --period "${PERIOD_LABEL}" \
            --staging-root resolver/staging \
            --snapshots-root data/snapshots \
            --db "${BACKFILL_DB_PATH}" \
            --allow-negatives 1
          echo "::endgroup::"

      # === PHASE 2: RESOLUTION SOURCES (non-fatal) ===
      - name: "Phase 2: Ingest FEWS NET IPC → facts_resolved"
        timeout-minutes: 30
        if: ${{ inputs.only_connector == '' || contains(inputs.only_connector, 'fewsnet_ipc') }}
        continue-on-error: true
        run: |
          echo "::group::FEWS NET IPC"
          python -m pythia.tools.ingest_structured_data --sources fewsnet_ipc 2>&1 | tee diagnostics/phase2_fewsnet.log || echo "WARNING: FEWS NET IPC ingest failed (non-fatal)"
          echo "::endgroup::"

      - name: "Phase 2: Ingest IPC API → facts_resolved"
        timeout-minutes: 30
        if: ${{ inputs.only_connector == '' || contains(inputs.only_connector, 'ipc_api') }}
        continue-on-error: true
        run: |
          echo "::group::IPC API"
          python -m pythia.tools.ingest_structured_data --sources ipc_api 2>&1 | tee diagnostics/phase2_ipc_api.log || echo "WARNING: IPC API ingest failed (non-fatal)"
          echo "::endgroup::"

      - name: "Phase 2: Ingest GDACS → facts_resolved"
        timeout-minutes: ${{ inputs.reset_db && 60 || 20 }}
        if: ${{ inputs.only_connector == '' || contains(inputs.only_connector, 'gdacs') }}
        continue-on-error: true
        run: |
          echo "::group::GDACS"
          python -m pythia.tools.ingest_structured_data --sources gdacs 2>&1 | tee diagnostics/phase2_gdacs.log || echo "WARNING: GDACS ingest failed (non-fatal)"
          echo "::endgroup::"

      # === PHASE 2.5: PA RESOLUTION MACHINE (non-fatal, SHADOW MODE) ===
      # resolver/hazard_resolution/ resolves people-affected per
      # country-month-hazard (detection + the impact ladder) into the haz_*
      # tables, then refreshes the base-rate tables the SPD prompt block
      # reads (forecaster/prompts.py::_load_haz_base_rate_block) — so the
      # 1st-of-month forecast picks them up from this same DB artifact.
      # SHADOW MODE: nothing here feeds compute_resolutions yet; the flip to
      # scoring is a separate deliberate change, gated on the acceptance
      # report this phase publishes into backfill-diagnostics.
      #
      # The trailing three months are re-run each cycle: answers stay
      # provisional until month-end + freeze_days (60), so each monthly run
      # revises the still-open months and the freeze guard protects the rest.
      - name: "Phase 2.5: Compute machine months (trailing unfrozen window)"
        id: haz_months
        if: ${{ inputs.only_connector == '' }}
        # Non-fatal like the rest of Phase 2.5 (shadow mode): on failure the
        # three machine steps below skip via their empty-months guard rather
        # than running `--months` with no arguments (argparse would reject
        # that, invisibly, inside a green step).
        continue-on-error: true
        run: |
          set -euo pipefail
          MONTHS=$(python -c "
          import datetime as dt
          today = dt.date.today()
          year, month = today.year, today.month
          months = []
          for _ in range(3):
              months.append(f'{year:04d}-{month:02d}')
              month -= 1
              if month == 0:
                  month, year = 12, year - 1
          print(' '.join(reversed(months)))
          ")
          if [ -z "${MONTHS}" ]; then
            echo "::warning::Phase 2.5 month computation produced no output — machine steps will be skipped"
            exit 1
          fi
          echo "months=$MONTHS" >> "$GITHUB_OUTPUT"
          echo "PA resolution machine months: $MONTHS"

      # The three machine steps use `set -o pipefail` (deliberately NOT -e):
      # without pipefail the pipeline's exit status is tee's — always 0 — so
      # the `|| ::warning` branch was dead code and a failed machine run was
      # indistinguishable from a clean one in the Actions UI. With pipefail
      # the warning fires; the `||` still makes the step exit 0, and
      # continue-on-error stays as belt and braces (shadow mode must never
      # fail the job).
      - name: "Phase 2.5: PA machine — flood"
        timeout-minutes: 60
        if: ${{ inputs.only_connector == '' && steps.haz_months.outputs.months != '' }}
        continue-on-error: true
        run: |
          set -o pipefail
          echo "::group::PA machine (flood)"
          python -m resolver.hazard_resolution.cli --hazard flood --months ${{ steps.haz_months.outputs.months }} --summary-out diagnostics/haz_run_flood.json 2>&1 | tee diagnostics/phase25_haz_flood.log || echo "::warning::flood resolution machine failed (non-fatal)"
          echo "::endgroup::"

      - name: "Phase 2.5: PA machine — cyclone"
        timeout-minutes: 75
        if: ${{ inputs.only_connector == '' && steps.haz_months.outputs.months != '' }}
        continue-on-error: true
        run: |
          set -o pipefail
          echo "::group::PA machine (cyclone)"
          python -m resolver.hazard_resolution.cli --hazard cyclone --months ${{ steps.haz_months.outputs.months }} --summary-out diagnostics/haz_run_cyclone.json 2>&1 | tee diagnostics/phase25_haz_cyclone.log || echo "::warning::cyclone resolution machine failed (non-fatal)"
          echo "::endgroup::"

      - name: "Phase 2.5: PA machine — drought"
        timeout-minutes: 20
        if: ${{ inputs.only_connector == '' && steps.haz_months.outputs.months != '' }}
        continue-on-error: true
        run: |
          set -o pipefail
          echo "::group::PA machine (drought)"
          python -m resolver.hazard_resolution.cli --hazard drought --months ${{ steps.haz_months.outputs.months }} --summary-out diagnostics/haz_run_drought.json 2>&1 | tee diagnostics/phase25_haz_drought.log || echo "::warning::drought resolution machine failed (non-fatal)"
          echo "::endgroup::"

      - name: "Phase 2.5: Refresh machine base rates + acceptance report"
        timeout-minutes: 15
        if: ${{ inputs.only_connector == '' }}
        continue-on-error: true
        run: |
          set -o pipefail
          echo "::group::PA machine base rates + acceptance"
          python -m resolver.hazard_resolution.base_rates 2>&1 | tee diagnostics/phase25_haz_base_rates.log || echo "::warning::base-rate refresh failed (non-fatal)"
          python -m resolver.hazard_resolution.acceptance --out diagnostics/haz_acceptance_report.md 2>&1 | tee diagnostics/phase25_haz_acceptance.log || echo "::warning::acceptance report failed (non-fatal)"
          echo "::endgroup::"

      # Collapse each raw cache to the row a reader would take. This does not
      # shrink the file -- DuckDB reuses freed blocks but never truncates, so
      # only the one-shot Compact Resolver DB workflow reclaims bytes -- but it
      # keeps the caches from re-accumulating between compactions.
      - name: "Phase 2.5: Compact machine raw caches"
        timeout-minutes: 20
        if: ${{ inputs.only_connector == '' }}
        continue-on-error: true
        run: |
          set -o pipefail
          echo "::group::PA machine raw-cache retention"
          python -m resolver.hazard_resolution.retention --apply 2>&1 | tee diagnostics/phase25_haz_retention.log || echo "::warning::raw-cache retention failed (non-fatal)"
          echo "::endgroup::"

      # === PHASE 3: STRUCTURED DATA — Pythia tables (non-fatal) ===
      - name: "Phase 3: Ingest conflict forecasts"
        timeout-minutes: 30
        if: ${{ inputs.only_connector == '' || contains(inputs.only_connector, 'conflict') }}
        continue-on-error: true
        run: |
          echo "::group::Conflict forecasts (VIEWS + conflictforecast.org + ACLED CAST)"
          python -m pythia.tools.ingest_structured_data --sources conflict 2>&1 | tee diagnostics/phase3_conflict.log || echo "WARNING: Conflict forecasts ingest failed (non-fatal)"
          echo "::endgroup::"

      - name: "Phase 3: Ingest ACAPS (4 datasets)"
        timeout-minutes: 30
        if: ${{ inputs.only_connector == '' || contains(inputs.only_connector, 'acaps') }}
        continue-on-error: true
        run: |
          echo "::group::ACAPS"
          python -m pythia.tools.ingest_structured_data --sources acaps 2>&1 | tee diagnostics/phase3_acaps.log || echo "WARNING: ACAPS ingest failed (non-fatal)"
          echo "::endgroup::"

      - name: "Phase 3: Ingest ReliefWeb reports"
        timeout-minutes: 30
        if: ${{ inputs.only_connector == '' || contains(inputs.only_connector, 'reliefweb') }}
        continue-on-error: true
        run: |
          echo "::group::ReliefWeb"
          python -m pythia.tools.ingest_structured_data --sources reliefweb 2>&1 | tee diagnostics/phase3_reliefweb.log || echo "WARNING: ReliefWeb ingest failed (non-fatal)"
          echo "::endgroup::"

      - name: "Phase 3: Ingest ACLED political events"
        timeout-minutes: 30
        if: ${{ inputs.only_connector == '' || contains(inputs.only_connector, 'acled_political') }}
        continue-on-error: true
        run: |
          echo "::group::ACLED political"
          python -m pythia.tools.ingest_structured_data --sources acled_political 2>&1 | tee diagnostics/phase3_acled_political.log || echo "WARNING: ACLED political ingest failed (non-fatal)"
          echo "::endgroup::"

      - name: "Phase 3: Ingest NMME seasonal forecasts"
        timeout-minutes: 30
        if: ${{ inputs.only_connector == '' || contains(inputs.only_connector, 'nmme') }}
        continue-on-error: true
        run: |
          echo "::group::NMME"
          python -m pythia.tools.ingest_structured_data --sources nmme 2>&1 | tee diagnostics/phase3_nmme.log || echo "WARNING: NMME ingest failed (non-fatal)"
          echo "::endgroup::"

      - name: "Phase 3: Ingest GDELT conflict indicators"
        timeout-minutes: 30
        if: ${{ inputs.only_connector == '' || contains(inputs.only_connector, 'gdelt') }}
        continue-on-error: true
        run: |
          echo "::group::GDELT"
          python -m pythia.tools.ingest_structured_data --sources gdelt 2>&1 | tee diagnostics/phase3_gdelt.log || echo "WARNING: GDELT ingest failed (non-fatal)"
          echo "::endgroup::"

      # === PHASE 4: CONTEXT SOURCES (non-fatal) ===
      # The published ONI table is the whole ENSO record, 1950 to present, in
      # one small file. Seeding it every cycle is idempotent (the table's PK
      # is the observation date and the ONI table is itself the record) and
      # costs one request. It is what gives the continuity check something to
      # compare against, and RC and base-rate work a real ENSO history rather
      # than the three rows the scrape-only design left behind.
      - name: "Phase 4: Backfill ENSO history from the published ONI table"
        timeout-minutes: 10
        if: ${{ inputs.only_connector == '' || contains(inputs.only_connector, 'enso') }}
        continue-on-error: true
        run: |
          set -euo pipefail
          python -m horizon_scanner.enso.enso_module --backfill-oni \
            2>&1 | tee diagnostics/phase4_enso_backfill.log \
            || echo "WARNING: ENSO ONI backfill failed (non-fatal)"

      - name: "Phase 4: Fetch + store ENSO state"
        timeout-minutes: 15
        if: ${{ inputs.only_connector == '' || contains(inputs.only_connector, 'enso') }}
        continue-on-error: true
        run: |
          set -euo pipefail
          RESULT=$(python -c "
          from horizon_scanner.enso.enso_module import fetch_and_store_enso
          ok = fetch_and_store_enso()
          print('ok' if ok else 'error')
          " 2>&1 | tee diagnostics/phase4_enso.log | tail -1) || RESULT="error"
          if [ "$RESULT" = "ok" ]; then
            python -m pythia.tools.emit_phase4_diag enso ok --rows 1
            echo "[enso] OK"
          else
            python -m pythia.tools.emit_phase4_diag enso error --reason "fetch-or-store-failed"
            echo "WARNING: ENSO fetch failed (non-fatal)"
          fi

      - name: "Phase 4: Fetch + store Seasonal TC outlooks"
        timeout-minutes: 15
        if: ${{ inputs.only_connector == '' || contains(inputs.only_connector, 'seasonal_tc') }}
        continue-on-error: true
        run: |
          set -euo pipefail
          RESULT=$(python -c "
          from horizon_scanner.seasonal_tc.seasonal_tc_runner import fetch_and_store_seasonal_tc
          ok = fetch_and_store_seasonal_tc()
          print('ok' if ok else 'error')
          " 2>&1 | tee diagnostics/phase4_seasonal_tc.log | tail -1) || RESULT="error"
          if [ "$RESULT" = "ok" ]; then
            python -m pythia.tools.emit_phase4_diag seasonal_tc ok --rows 1
            echo "[seasonal_tc] OK"
          else
            python -m pythia.tools.emit_phase4_diag seasonal_tc error --reason "fetch-or-store-failed"
            echo "WARNING: Seasonal TC fetch failed (non-fatal)"
          fi

      - name: "Phase 4: Store HDX Signals"
        timeout-minutes: 15
        if: ${{ inputs.only_connector == '' || contains(inputs.only_connector, 'hdx_signals') }}
        continue-on-error: true
        run: |
          set -euo pipefail
          ROWS=$(python -c "
          from horizon_scanner.hdx_signals import bulk_fetch_and_store_hdx_signals
          n = bulk_fetch_and_store_hdx_signals()
          print(n)
          " 2>&1 | tee diagnostics/phase4_hdx_signals.log | tail -1) || ROWS="0"
          if ! echo "$ROWS" | grep -qE '^[0-9]+$'; then
            ROWS="0"
          fi
          if [ "$ROWS" -gt 0 ]; then
            python -m pythia.tools.emit_phase4_diag hdx_signals ok --rows "$ROWS"
            echo "[hdx_signals] OK: stored ${ROWS} signals"
          else
            python -m pythia.tools.emit_phase4_diag hdx_signals error --reason "zero-rows-returned"
            echo "WARNING: HDX Signals fetch failed (non-fatal)"
          fi

      # Refresh the CrisisWatch edition ON THE RUNNER before storing it.
      #
      # refresh-crisiswatch.yml used to commit the scraped JSON back to main,
      # and that push started being rejected by branch protection (GH006,
      # "Changes must be made through a pull request") around 2026-08-06. The
      # scrape kept working; only the commit failed. So the checked-in
      # crisiswatch_latest.json froze at the 2026-07-29 edition and the store
      # step below carried on faithfully writing that stale edition into
      # crisiswatch_entries — a silent data freeze behind a green step.
      #
      # Nothing here needs a push: this job already holds the canonical DB and
      # already uploads it, so refreshing the working copy is enough for the
      # DB to get the current edition. --only-if-newer keeps it idempotent and
      # never regresses to an older edition; --expect-edition-by-day 7 turns a
      # genuinely missing monthly edition red rather than silently old.
      #
      # continue-on-error: a failed scrape degrades to storing whatever edition
      # is checked in, which is exactly today's behaviour, not worse than it.
      # The IA_S3_* secrets are optional — the Wayback path works anonymously,
      # just less reliably.
      - name: "Phase 4: Refresh CrisisWatch edition (Wayback)"
        timeout-minutes: 30
        if: ${{ inputs.only_connector == '' || contains(inputs.only_connector, 'crisiswatch') }}
        continue-on-error: true
        env:
          IA_S3_ACCESS_KEY: ${{ secrets.IA_S3_ACCESS_KEY }}
          IA_S3_SECRET_KEY: ${{ secrets.IA_S3_SECRET_KEY }}
        run: |
          set -euo pipefail
          python -m scripts.refresh_crisiswatch \
            --source wayback \
            --only-if-newer \
            --max-age-days 60 \
            --expect-edition-by-day 7 \
            --verbose 2>&1 | tee diagnostics/phase4_crisiswatch_refresh.log

      - name: "Phase 4: Store CrisisWatch"
        timeout-minutes: 15
        if: ${{ inputs.only_connector == '' || contains(inputs.only_connector, 'crisiswatch') }}
        continue-on-error: true
        run: |
          set -euo pipefail
          ROWS=$(python -c "
          from horizon_scanner.crisiswatch import bulk_store_crisiswatch
          n = bulk_store_crisiswatch()
          print(n)
          " 2>&1 | tee diagnostics/phase4_crisiswatch.log | tail -1) || ROWS="0"
          if ! echo "$ROWS" | grep -qE '^[0-9]+$'; then
            ROWS="0"
          fi
          if [ "$ROWS" -gt 0 ]; then
            python -m pythia.tools.emit_phase4_diag crisiswatch ok --rows "$ROWS"
            echo "[crisiswatch] OK: stored ${ROWS} entries"
          else
            python -m pythia.tools.emit_phase4_diag crisiswatch error --reason "zero-rows-or-missing-edition"
            echo "WARNING: CrisisWatch store failed (non-fatal)"
          fi

      # === PHASE 5: VERIFY + EXPORT ===
      - name: Verify DuckDB counts
        run: |
          set -euo pipefail
          DB_PATH="${BACKFILL_DB_PATH}"
          python scripts/ci/verify_duckdb_counts.py "${DB_PATH}" \
            --allow-missing \
            --tables acled_monthly_fatalities facts_resolved facts_deltas

      - name: Summarize DuckDB contents
        run: |
          set -euo pipefail
          mkdir -p diagnostics/ingestion
          python -m scripts.ci.duckdb_summary \
            --db "${BACKFILL_DB_PATH}" \
            --tables "acled_monthly_fatalities,facts_resolved,facts_deltas" \
            | tee diagnostics/ingestion/duckdb_summary.md
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            cat diagnostics/ingestion/duckdb_summary.md >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Summarize connector diagnostics
        if: always()
        run: |
          set -euo pipefail
          python -m scripts.ci.summarize_connectors \
            --report diagnostics/ingestion/connectors_report.jsonl \
            --out diagnostics/ingestion/summary.md \
            --github-step-summary || true

      - name: Consolidated pipeline status summary
        if: always()
        run: |
          set -euo pipefail
          python -m pythia.tools.summarize_all_phases \
            --report "${DIAGNOSTICS_REPORT_PATH}" \
            --db "${BACKFILL_DB_PATH}" \
            >> "${GITHUB_STEP_SUMMARY}" || true

      - name: Simple DuckDB snapshot
        run: |
          set -euo pipefail
          python -m resolver.cli.simple_snapshot --db "${BACKFILL_DB_PATH}" || true

      - name: Compute DB signature after backfill
        id: signature_after
        if: ${{ env.CANONICAL_DB_READY == 'true' }}
        run: |
          set -euo pipefail
          python -m scripts.ci.db_signature compare \
            --before diagnostics/db_signature_before.json \
            --after-db "${BACKFILL_DB_PATH}" \
            --required "${SIGNATURE_REQUIRED_TABLES}" \
            --optional "${SIGNATURE_OPTIONAL_TABLES}" \
            --all-tables \
            --out diagnostics/db_signature_after.json
          echo "SIGNATURE_OK=true" >> "$GITHUB_ENV"
          echo "signature_ok=true" >> "$GITHUB_OUTPUT"

      - name: Upload canonical resolver DB
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pythia-resolver-db
          path: data/resolver.duckdb

      - name: Upload reset resolver DB snapshot
        if: success() && github.event_name == 'workflow_dispatch' && inputs.reset_db
        uses: actions/upload-artifact@v4
        with:
          name: pythia-resolver-db-reset
          path: data/resolver.duckdb

      # One self-contained zip an analyst can open with no repo, no workflow
      # logs and no database: URLs and response envelopes, per-cell and
      # per-figure ledgers, the rulebook and workflows verbatim, the source
      # files that participated, and a contradiction report across all of it.
      # `if: always()` because the runs worth diagnosing are the ones that
      # failed, and `continue-on-error` because a diagnostic must never be
      # the thing that turns an otherwise good ingest red.
      - name: Build resolver debug bundle
        if: always()
        continue-on-error: true
        timeout-minutes: 15
        run: |
          set -o pipefail
          python -m scripts.build_resolver_debug_bundle \
            --db "${BACKFILL_DB_PATH}" \
            --diagnostics-dir diagnostics \
            --run-log-dir diagnostics/run_log \
            --out "debug_bundle/resolver-debug-bundle-${GITHUB_RUN_ID}.zip" \
            2>&1 | tee diagnostics/build_debug_bundle.log \
            || echo "::warning::resolver debug bundle build failed (non-fatal)"

      - name: Upload resolver debug bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resolver-debug-bundle-${{ github.run_id }}
          # Deliberately outside diagnostics/ — the zip already carries the
          # logs, so uploading it inside backfill-diagnostics would ship
          # every one of them twice.
          path: debug_bundle/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backfill-diagnostics
          path: |
            diagnostics/
          retention-days: 30
          if-no-files-found: warn
