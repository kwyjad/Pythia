---
name: TEMP PR2 probe

# TEMPORARY, removed before merge. Reads what only a runner can reach: the
# CPC NMME FTP layout and NetCDF units, and the raw ACAPS INFORM records.
"on":
  push:
    branches: [claude/prompt-inject-repairs]
    paths:
      - ".github/workflows/tmp-pr2-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests xarray netCDF4 numpy
      - name: CPC NMME FTP layout and units
        continue-on-error: true
        run: |
          python - <<'PY'
          from ftplib import FTP
          import xarray as xr, numpy as np
          ftp = FTP("ftp.cpc.ncep.noaa.gov"); ftp.login()
          for d in ["/NMME", "/NMME/realtime_anom", "/NMME/realtime_anom/ENSMEAN"]:
              try:
                  ftp.cwd(d); names = sorted(ftp.nlst()); print(d, len(names), names[:15], names[-6:])
              except Exception as e:
                  print(d, "ERR", e)
          ftp.cwd("/NMME/realtime_anom/ENSMEAN"); dirs = sorted(ftp.nlst()); last = dirs[-1]
          ftp.cwd(last); files = sorted(ftp.nlst()); print("latest", last, files)
          for f in files:
              if "prate" in f and f.endswith(".nc"):
                  with open(f, "wb") as fh: ftp.retrbinary("RETR " + f, fh.write)
                  ds = xr.open_dataset(f, decode_times=False)
                  print(f, ds)
                  for v in ds.data_vars:
                      a = ds[v].values
                      print(v, ds[v].attrs, "min", np.nanmin(a), "max", np.nanmax(a), "std", np.nanstd(a))
          PY
      - name: ACAPS INFORM raw records
        continue-on-error: true
        env:
          ACAPS_USERNAME: ${{ secrets.ACAPS_USERNAME }}
          ACAPS_PASSWORD: ${{ secrets.ACAPS_PASSWORD }}
        run: |
          python - <<'PY'
          import os, json, requests
          B = "https://api.acaps.org"
          t = requests.post(f"{B}/api/v1/token-auth/", json={"username": os.environ["ACAPS_USERNAME"], "password": os.environ["ACAPS_PASSWORD"]}, timeout=30).json()["token"]
          H = {"Authorization": f"Token {t}"}
          for path in ["/api/v1/inform-severity-index/Sep2026/?iso3=AFG", "/api/v1/inform-severity-index/country-log/?iso3=AFG"]:
              r = requests.get(B + path, headers=H, timeout=60)
              d = r.json()
              res = d.get("results", d) if isinstance(d, dict) else d
              print(path, r.status_code, "count", d.get("count") if isinstance(d, dict) else None)
              for rec in (res or [])[:6]:
                  print(json.dumps({k: v for k, v in rec.items() if not isinstance(v, str) or len(v) < 200}, default=str)[:1500])
          PY
