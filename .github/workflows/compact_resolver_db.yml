# One-shot reclamation of the canonical DB.
#
# The haz_raw_* caches were append-only in practice: a wall clock inside the
# hashed payload defeated the content-hash dedup, so every nightly backcast
# appended a full duplicate of every record it touched. The canonical DB went
# 3.0 GB (2026-08-06) -> 17.7 GB (2026-09-01) and the release publish aborted.
#
# Fixing the hash (resolver/hazard_resolution/sources.py) stops the growth.
# This gives the space back, in the order that matters:
#
#   1. collapse the rows  (retention.compact_all --apply)
#   2. copy the file      (build_release_db.compact_database)
#
# Rebuilding first means the copy's source is ~2 GB rather than 17.7 GB. The
# other order needs ~40 GB of runner scratch.
#
# This workflow PRODUCES pythia-resolver-db, so it is listed in the
# canonical-DB candidate list (.github/actions/download-canonical-db) and in
# the two bespoke discovery blocks (run_horizon_scanner.yml,
# publish_latest_data.yml) -- and it includes ITSELF via extra-workflows, so a
# second run starts from the first one's output rather than the 17.7 GB
# artifact it replaced.
#
# Dry run is the default. Read the plan, then re-dispatch with apply=true.
#
# maintenance=conflict_resolution_reset (Sept 2026) is a second, separate job
# on the same canonical producer, so no new producer joins the discovery
# lists. ACE/FATALITIES had resolved to ACLED's battles-only series; before
# the post-fix rerun of compute_resolutions -> scores -> calibration, this
# (1) exports an audit copy of the wrong ACE/FATALITIES rows as the
# pythia-audit-prefix-conflict-resolution artifact (always, even on a dry
# run), (2) relabels battles-only ACLED facts rows to fatalities_battle_month,
# and (3) deletes the hazard-specific ACE/FATALITIES bucket centroids so EIV
# falls back to the seeds (the EMA only moves a wrong centroid a tenth of the
# way per run). The compaction steps do not run in this mode.
#
# maintenance=conflict_displacement_reset (Oct 2026) does the same for
# ACE/PA: IDMC conflict displacement had been zero-defaulted for months IDMC
# simply had not reported yet (60 of 64 zeros on the 5 October release were
# trailing). It (1) exports an audit copy of every ACE/PA row in the
# resolution, score and learned tables as pythia-audit-conflict-displacement
# (always, even on a dry run), (2) on apply deletes them all, including the
# ACE/PA family_recalibration factors, calibration weights and advice and
# the hazard-specific centroids, and (3) after the canonical upload
# dispatches Compute Resolutions, whose workflow_run chain re-resolves under
# the settled rule and rebuilds scores, calibration and the release.

---
name: Compact Resolver DB

# Scheduled since Oct 2026 (the 4th and the 20th, 04:17 UTC): the canonical
# DB went 18 GB -> 30.6 GB in nine days, and compaction was manual. The days
# avoid the SPEI-3 producer (8th), the Resolver Update and forecast window
# (10th-13th) and the nightly backcast (20:30 UTC). A scheduled run applies
# the compaction; it is gated on the staged pipeline like the weekly ingest,
# and the pythia-resolver-db group sits on the writing job, never at the
# workflow level (a gate that usually skips would take the group's one
# pending slot).
"on":
  schedule:
    - cron: "17 4 4,20 * *"
  workflow_dispatch:
    inputs:
      apply:
        description: "Write the changes (unchecked = report the plan only)"
        required: false
        default: false
        type: boolean
      maintenance:
        description: "What to do: compact (the raw-cache compaction), conflict_resolution_reset (ACE/FATALITIES audit + relabel + centroid reset) or conflict_displacement_reset (ACE/PA audit + delete + re-resolve)"
        required: false
        default: compact
        type: choice
        options:
          - compact
          - conflict_resolution_reset
          - conflict_displacement_reset
      db_run_id:
        description: "Optional: force canonical DB from an Actions run ID. Blank = latest successful producer."
        required: false
        default: ""
        type: string

permissions:
  contents: read
  # write: the conflict_displacement_reset mode dispatches Compute Resolutions.
  actions: write

jobs:
  gate:
    name: Skip if a staged pipeline is in flight
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check for in-flight staged pipeline
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: "false"
        run: python3 -m scripts.ci.check_pipeline_active

  compact:
    needs: gate
    if: ${{ always() && (github.event_name != 'schedule' || needs.gate.outputs.proceed == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: pythia-resolver-db
      cancel-in-progress: false
    env:
      # A scheduled run has no inputs: it applies the raw-cache compaction.
      APPLY: ${{ github.event_name == 'schedule' && 'true' || format('{0}', inputs.apply) }}
      MODE: ${{ github.event_name == 'schedule' && 'compact' || inputs.maintenance }}
      RESOLVER_DB_URL: duckdb:///${{ github.workspace }}/data/resolver.duckdb
      PYTHIA_DB_URL: duckdb:///${{ github.workspace }}/data/resolver.duckdb
      # haz_raw_* are deliberately in NEITHER list: they shrink by design, and
      # db_signature treats a required-table shrink as fatal. The machine's
      # working tables ARE listed (optional) so an unexpected change to the
      # resume ledger or the verdicts is at least warned about -- those are
      # what this job must not touch.
      SIGNATURE_REQUIRED_TABLES: questions,hs_triage,forecasts_ensemble,llm_calls,facts_resolved,facts_deltas
      SIGNATURE_OPTIONAL_TABLES: haz_backcast_progress,haz_triggers,haz_resolutions,haz_doc_extractions,haz_impact_candidates,haz_revisions,haz_base_rates_occurrence,haz_base_rates_severity

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          set -e
          python -m pip install --upgrade pip
          pip install -r python_library_requirements.txt

      - name: Download canonical resolver DB
        id: canonical_download
        uses: ./.github/actions/download-canonical-db
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          force-run-id: ${{ inputs.db_run_id }}
          extra-workflows: Compact Resolver DB
          # The reclaim step writes a second, compacted file beside the first.
          room-factor: "1.2"

      # The rollback handle. The canonical artifact is immutable per run and
      # retained for 90 days, so recovering from a bad compaction is a
      # re-dispatch with force-run-id set to the run named here.
      - name: Record the source run for rollback
        env:
          IN_DB_RUN_ID: ${{ inputs.db_run_id }}
          IN_APPLY: ${{ env.APPLY }}
        run: |
          set -euo pipefail
          SRC_RUN="${CANONICAL_DB_RUN_ID:-${IN_DB_RUN_ID}}"
          echo "Canonical DB came from run: ${SRC_RUN:-<discovery, see previous step>}"
          {
            echo "### Compact Resolver DB"
            echo ""
            echo "- apply: \`${IN_APPLY}\`"
            echo "- source canonical run: \`${SRC_RUN:-see download step log}\`"
            echo ""
            echo "To roll back, re-dispatch any canonical consumer with"
            echo "\`db_run_id\` set to the source run above."
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: DB signature before
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          rm -f data/resolver.duckdb.wal
          python -m scripts.ci.db_signature write \
            --db data/resolver.duckdb \
            --required "${SIGNATURE_REQUIRED_TABLES}" \
            --optional "${SIGNATURE_OPTIONAL_TABLES}" \
            --out diagnostics/db_signature_before.json

      - name: Table sizes before
        continue-on-error: true
        run: |
          set -euo pipefail
          python -m scripts.ci.db_table_sizes --db data/resolver.duckdb --top 40 \
            | tee diagnostics/table_sizes_before.txt
          {
            echo "#### Table sizes before"
            echo '```'
            cat diagnostics/table_sizes_before.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Bytes each producer added per run (db_growth_log) and haz_revisions
      # rows and provenance bytes per day: the growth before and after the
      # October 2026 revision dedupe.
      - name: Growth report
        continue-on-error: true
        run: |
          set -euo pipefail
          python -m scripts.ci.db_growth report --db data/resolver.duckdb \
            --json-out diagnostics/db_growth_report.json | tee diagnostics/db_growth_report.txt

      # Always runs, apply or not: the plan is what a human reads before
      # authorising the write.
      - name: "Dry run: the compaction plan"
        if: env.MODE == 'compact'
        run: |
          set -euo pipefail
          python -m resolver.hazard_resolution.retention \
            --db data/resolver.duckdb | tee diagnostics/retention_plan.txt
          {
            echo "#### Compaction plan (rows)"
            echo '```'
            cat diagnostics/retention_plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collapse the raw caches
        if: env.APPLY == 'true' && env.MODE == 'compact'
        run: |
          set -euo pipefail
          python -m resolver.hazard_resolution.retention \
            --db data/resolver.duckdb --apply | tee diagnostics/retention_applied.txt
          {
            echo "#### Compaction applied (rows)"
            echo '```'
            cat diagnostics/retention_applied.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Step 2, and the one that actually returns bytes. Deleting rows leaves
      # the blocks in the file; only a copy to a fresh database reclaims them.
      # Disk is plausibly the next thing to fail here: this step holds the
      # multi-GB canonical DB AND the compacted copy at the same time, and
      # publish_latest_data.yml's own "~14 GB runner disk" note is stale. A
      # copy that dies for want of space otherwise looks like a DuckDB error.
      - name: Reclaim the file
        if: env.APPLY == 'true' && env.MODE == 'compact'
        run: |
          set -euo pipefail
          echo "disk before: $(df -h . | tail -1)"
          rm -f data/resolver.duckdb.wal
          BEFORE=$(stat -c%s data/resolver.duckdb)
          python - <<'PY'
          from scripts.ci.build_release_db import compact_database
          stats = compact_database(
              "data/resolver.duckdb", "data/resolver.compacted.duckdb"
          )
          mb = 1024 * 1024
          print(
              f"compacted {stats['src_bytes']/mb:,.1f} MB -> "
              f"{stats['out_bytes']/mb:,.1f} MB "
              f"(reclaimed {stats['saved_bytes']/mb:,.1f} MB)"
          )
          PY
          mv -f data/resolver.compacted.duckdb data/resolver.duckdb
          AFTER=$(stat -c%s data/resolver.duckdb)
          echo "file: ${BEFORE} -> ${AFTER} bytes"
          echo "disk after: $(df -h . | tail -1)"
          {
            echo "#### File reclaimed"
            echo ""
            echo "\`${BEFORE}\` -> \`${AFTER}\` bytes"
            echo ""
            echo "Disk: \`$(df -h . | tail -1)\`"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      # --- maintenance=conflict_resolution_reset ------------------------
      # The audit copy runs on a dry run as well: it is read-only, and it is
      # the record of what the rerun is about to replace.
      - name: "Conflict reset: export the audit copy"
        if: env.MODE == 'conflict_resolution_reset'
        run: |
          set -euo pipefail
          rm -f data/resolver.duckdb.wal
          python -m scripts.reset_conflict_centroids \
            --db "duckdb:///${{ github.workspace }}/data/resolver.duckdb" \
            --audit-dir audit/prefix_conflict_resolution --audit-only \
            --summary-out diagnostics/conflict_reset_plan.json \
            | tee diagnostics/conflict_reset_plan.txt
          python -m resolver.tools.repair_acled_fatalities_metric \
            --db "duckdb:///${{ github.workspace }}/data/resolver.duckdb" --dry-run \
            --summary-out diagnostics/relabel_plan.json | tee -a diagnostics/conflict_reset_plan.txt
          {
            echo "#### ACE/FATALITIES reset plan"
            echo '```'
            cat diagnostics/conflict_reset_plan.json diagnostics/relabel_plan.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "Conflict reset: upload the audit copy"
        if: env.MODE == 'conflict_resolution_reset'
        uses: actions/upload-artifact@v4
        with:
          name: pythia-audit-prefix-conflict-resolution
          path: audit/prefix_conflict_resolution/
          retention-days: 90
          if-no-files-found: error

      - name: "Conflict reset: relabel battles-only facts and reset centroids"
        if: env.APPLY == 'true' && env.MODE == 'conflict_resolution_reset'
        run: |
          set -euo pipefail
          python -m resolver.tools.repair_acled_fatalities_metric \
            --db "duckdb:///${{ github.workspace }}/data/resolver.duckdb" \
            --summary-out diagnostics/relabel_applied.json
          python -m scripts.reset_conflict_centroids \
            --db "duckdb:///${{ github.workspace }}/data/resolver.duckdb" \
            --summary-out diagnostics/conflict_reset_applied.json
          {
            echo "#### ACE/FATALITIES reset applied"
            echo '```'
            cat diagnostics/relabel_applied.json diagnostics/conflict_reset_applied.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # --- maintenance=conflict_displacement_reset ----------------------
      - name: "Conflict displacement reset: export the audit copy"
        if: env.MODE == 'conflict_displacement_reset'
        run: |
          set -euo pipefail
          rm -f data/resolver.duckdb.wal
          python -m scripts.reset_conflict_displacement \
            --db data/resolver.duckdb \
            --audit-dir audit/conflict_displacement --audit-only \
            --summary-out diagnostics/conflict_displacement_plan.json
          {
            echo "#### ACE/PA reset plan (rows that will be deleted)"
            echo '```'
            cat diagnostics/conflict_displacement_plan.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "Conflict displacement reset: upload the audit copy"
        if: env.MODE == 'conflict_displacement_reset'
        uses: actions/upload-artifact@v4
        with:
          name: pythia-audit-conflict-displacement
          path: audit/conflict_displacement/
          retention-days: 90
          if-no-files-found: error

      - name: "Conflict displacement reset: delete the ACE/PA rows"
        if: env.APPLY == 'true' && env.MODE == 'conflict_displacement_reset'
        run: |
          set -euo pipefail
          python -m scripts.reset_conflict_displacement \
            --db data/resolver.duckdb \
            --summary-out diagnostics/conflict_displacement_applied.json
          {
            echo "#### ACE/PA reset applied"
            echo '```'
            cat diagnostics/conflict_displacement_applied.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The proof that the resume ledger and the verdicts survived. A
      # required-table regression fails the job BEFORE the upload, so a
      # damaged DB never becomes the canonical artifact.
      - name: DB signature after
        if: env.APPLY == 'true'
        run: |
          set -euo pipefail
          python -m scripts.ci.db_signature compare \
            --before diagnostics/db_signature_before.json \
            --after-db data/resolver.duckdb \
            --required "${SIGNATURE_REQUIRED_TABLES}" \
            --optional "${SIGNATURE_OPTIONAL_TABLES}" \
            --out diagnostics/db_signature_after.json

      - name: Table sizes after
        if: env.APPLY == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          python -m scripts.ci.db_table_sizes --db data/resolver.duckdb --top 40 \
            | tee diagnostics/table_sizes_after.txt
          {
            echo "#### Table sizes after"
            echo '```'
            cat diagnostics/table_sizes_after.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compact-resolver-db-diagnostics
          retention-days: 90
          path: diagnostics/
          if-no-files-found: warn

      # Only on apply: a dry run must not republish the canonical artifact,
      # or a no-op run would displace the real one in discovery.
      # A step's `if:` already implies success(), so naming it as well would
      # only trip the A && B || C shell lint for no behavioural gain.
      - name: Refuse to upload over a newer canonical DB
        if: env.APPLY == 'true'
        uses: ./.github/actions/guard-canonical-upload
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          downloaded-run-id: ${{ steps.canonical_download.outputs.run-id }}
          source: ${{ steps.canonical_download.outputs.source }}

      - name: Upload compacted canonical DB
        if: env.APPLY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pythia-resolver-db
          retention-days: 90
          path: data/resolver.duckdb

      # After the upload, so the chain starts from this run's DB: Compute
      # Resolutions re-resolves ACE/PA under the settled rule, and its
      # workflow_run chain rebuilds scores, calibration and the release.
      - name: "Conflict displacement reset: start the resolution chain"
        if: env.APPLY == 'true' && env.MODE == 'conflict_displacement_reset'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run compute_resolutions.yml --ref main --repo "${GITHUB_REPOSITORY}"
          echo "Dispatched Compute Resolutions; it chains to scores, calibration and publish." >> "$GITHUB_STEP_SUMMARY"
