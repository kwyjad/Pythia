---
name: Sibyl Deep Research

# Sibling to the standard forecasting pipeline: runs once a Horizon Scanner
# Triage run (which writes the volatility/RC scores and questions Sibyl
# selects from) has completed. Forecasts the top-10 highest-volatility
# affected/fatalities questions via agentic open-web research (Opus + Brave)
# and writes the results beside the standard track in the canonical DB.

on:
  workflow_run:
    workflows: ["Horizon Scanner Triage"]
    types: [completed]

  workflow_dispatch:
    inputs:
      hs_run_id:
        description: "HS run to forecast (default: latest with active questions)"
        required: false
        default: ""
      run_hard_cap_usd:
        description: "Hard run budget cap in USD"
        required: false
        default: "40"
      db_run_id:
        description: "Force pythia-resolver-db from this workflow run id"
        required: false
        default: ""

concurrency:
  group: pythia-resolver-db
  cancel-in-progress: false

permissions:
  contents: read
  actions: write  # dispatches publish_latest_data.yml after the artifact upload

jobs:
  sibyl:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      RESOLVER_DB_URL: duckdb:///${{ github.workspace }}/data/resolver.duckdb
      PYTHIA_DB_URL: duckdb:///${{ github.workspace }}/data/resolver.duckdb
      # Prompt-cost switches (production since 2026-07-27): Sibyl's
      # sequential step prompts use the 4-block static-first template with
      # Anthropic cache_control breakpoints — repeated per-question context
      # is billed at the 0.1x cached-read rate instead of full price.
      PYTHIA_PROMPT_V3_ORDER: "1"
      PYTHIA_PROMPT_CACHE_ENABLED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (minimal)
        run: |
          python -m pip install --upgrade pip
          pip install -r python_library_requirements.txt
          pip install duckdb

      # Forced mode: operator-supplied db_run_id (fatal if unavailable).
      # Path A: triggering HS Triage run. Path B: canonical discovery.
      # Shared logic + candidate list live in .github/actions/download-canonical-db.
      - name: Download canonical resolver DB
        uses: ./.github/actions/download-canonical-db
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          force-run-id: ${{ github.event.inputs.db_run_id }}
          run-id: ${{ github.event.workflow_run.id }}

      # stage_health windows its cost rollup on this. llm_calls accumulates in
      # the travelling DB, so without a start marker the only thing reportable
      # is the DB's cumulative spend, not what Sibyl actually cost.
      - name: Record stage start
        run: echo "STAGE_STARTED_AT=$(date -u +'%Y-%m-%d %H:%M:%S')" >> "$GITHUB_ENV"

      - name: Gate on eligible questions with volatility scores
        id: gate
        run: |
          set -euo pipefail
          python - <<'EOF' | tee gate_out.txt
          import json
          import os
          os.environ.setdefault("PYTHIA_DB_URL", os.environ["RESOLVER_DB_URL"])
          from sibyl.select_questions import eligibility_breakdown, select_top_questions
          hs_run_id = os.environ.get("SIBYL_HS_RUN_ID") or None
          # Per-pair diagnostics so a 0-eligible outcome is self-explanatory
          # (active questions per pair, pair eligibility, test-run status).
          print("SIBYL_ELIGIBILITY_BREAKDOWN=" + json.dumps(eligibility_breakdown(hs_run_id)))
          qs = select_top_questions(hs_run_id)
          print(f"SIBYL_ELIGIBLE_COUNT={len(qs)}")
          EOF
          COUNT=$(grep -oE 'SIBYL_ELIGIBLE_COUNT=[0-9]+' gate_out.txt | tail -1 | cut -d= -f2)
          echo "eligible=${COUNT:-0}" >> "$GITHUB_OUTPUT"
          if [ "${COUNT:-0}" = "0" ]; then
            echo "No eligible questions with volatility scores — skipping Sibyl run."
          fi
        env:
          SIBYL_HS_RUN_ID: ${{ github.event.inputs.hs_run_id }}

      - name: Run Sibyl
        if: steps.gate.outputs.eligible != '0'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          # MODEL_COSTS_JSON env override removed 2026-07: pythia/model_costs.json
          # (now per-1M-token rates) is authoritative and carries the
          # claude-opus-5 entry Sibyl's budget cap depends on.
          SIBYL_RUN_HARD_CAP_USD: ${{ github.event.inputs.run_hard_cap_usd || '40' }}
          SIBYL_BUDGET_USD_PER_QUESTION: ${{ vars.SIBYL_BUDGET_USD_PER_QUESTION || '' }}
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.hs_run_id }}" ]; then
            python -m sibyl.run --hs-run-id "${{ github.event.inputs.hs_run_id }}" | tee sibyl_stdout.txt
          else
            python -m sibyl.run | tee sibyl_stdout.txt
          fi

      # Deviation-from-base-rate rows (forecast_deviation) — recomputed here
      # so Sibyl's forecasts (written under the standard forecaster run_id
      # with model_name='sibyl') get deviation rows too, and so the legacy
      # sync pipeline (run_horizon_scanner.yml, which has no deviation step)
      # is covered by the Sibyl leg that chains off it. Idempotent per run.
      # Non-fatal: a deviation bug must never cost the run its DB upload or
      # its publish dispatch.
      - name: Compute forecast deviation
        if: always()
        continue-on-error: true
        run: |
          set +e
          python -m pythia.tools.compute_deviation --db-url "${RESOLVER_DB_URL}"
          exit 0

      # The interpreter's input pack: what this run forecast, deviation from
      # base rates, deltas vs the previous run. Built here because this is
      # the last stage of the forecast chain — the DB now holds the run's
      # forecasts, Sibyl's rows AND the deviation rows computed above.
      # Non-fatal, same contract as every diagnostic step.
      - name: Build current-run bundle
        if: always()
        continue-on-error: true
        run: |
          set +e
          python -m scripts.ai_bundle.build_current_run_bundle \
            --db "${RESOLVER_DB_URL}" --out-dir ai_bundle
          exit 0

      # What the selection gate did, and what the base-rate anchors rest on.
      # Both write to the step summary AND to the diagnostics artifact,
      # because a diagnostic that exists only in a job log does not exist:
      # logs expire, artifacts are the record. Read them when a section comes
      # back empty — an empty worsening list is a legitimate result and this
      # is how it is told apart from a threshold set wrong.
      - name: Gate recalibration and anchor depth
        if: always()
        continue-on-error: true
        run: |
          set +e
          mkdir -p diagnostics
          {
            echo "## Selection gate"
            echo '```'
            python -m interpreter.gatecheck --db "${RESOLVER_DB_URL}"
            echo '```'
            echo "## Selection gate, level mode (the pre-v4 rollback)"
            echo '```'
            python -m interpreter.gatecheck --db "${RESOLVER_DB_URL}" --mode level
            echo '```'
            echo "## Base-rate anchor depth"
            echo '```'
            python -m interpreter.anchorcheck --db "${RESOLVER_DB_URL}" \
              --json-out diagnostics/anchor_depth.json
            echo '```'
          } | tee diagnostics/gate_recalibration.md >> "${GITHUB_STEP_SUMMARY}"
          exit 0

      - name: Upload gate diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: pythia-interpreter-gate-diagnostics
          path: |
            diagnostics/gate_recalibration.md
            diagnostics/anchor_depth.json
          if-no-files-found: warn
          retention-days: 90

      - name: Upload current-run bundle
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: pythia-current-run-bundle
          path: ai_bundle/current_run_analysis__*.zip
          if-no-files-found: warn
          retention-days: 90

      # The interpreter (Phase 6): one plain-language report per cycle,
      # generated from the current-run bundle built above. Runs HERE — the
      # last stage of the forecast chain, before the canonical DB upload and
      # the publish dispatch — so the published DB already contains the
      # interpretations row (release order stays pythia → Sibyl →
      # interpreter → publish). The combined kind folds in the latest stored
      # scored interpretation from the DB; no scored row → an explicit "no
      # scored run available yet" section. Non-fatal like every diagnostic:
      # a report bug must never cost the run its DB upload or its publish
      # dispatch (interpreter.run's main() also always returns 0).
      - name: Generate interpreter report (combined)
        if: always()
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set +e
          PACK=$(find ai_bundle -maxdepth 1 -name 'current_run_analysis__*.zip' 2>/dev/null | sort | tail -n 1)
          if [ -z "${PACK}" ]; then
            echo "::warning::No current-run bundle found — skipping interpreter."
            exit 0
          fi
          python -m interpreter.run \
            --db "${RESOLVER_DB_URL}" \
            --kind combined \
            --pack "${PACK}" \
            --out-dir interpreter_out
          exit 0

      # WeasyPrint renders the stored report to PDF (CI-side, never in the
      # API container; /interpreter/print + window.print() stays the
      # fallback when this asset is missing). The system pango libraries are
      # usually preinstalled on ubuntu runners; the apt install is a
      # best-effort top-up. A render failure keeps the HTML as evidence and
      # still exits 0.
      - name: Render interpreter PDF
        if: always()
        continue-on-error: true
        run: |
          set +e
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 >/dev/null 2>&1
          pip install weasyprint >/dev/null 2>&1
          python -m interpreter.pdf \
            --db "${RESOLVER_DB_URL}" \
            --kind combined \
            --out-dir interpreter_out
          exit 0

      # publish_latest_data.yml fetches this artifact (best-effort) from the
      # dispatching run and attaches the PDFs to the release.
      - name: Upload interpreter report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: pythia-interpreter-report
          path: |
            interpreter_out/report__*.pdf
            interpreter_out/interpreter_report_latest.pdf
            interpreter_out/report_*_v*.md
            interpreter_out/report__*.html
          if-no-files-found: warn
          retention-days: 90

      # Sibyl ran 40+ minutes on Claude Opus under a $40 hard cap with NO
      # telemetry of any kind — plausibly the most expensive stage in the
      # pipeline and the only one whose spend was unmeasured. Same never-fail
      # contract as the pipeline stages: a reporting bug must not cost a run
      # its DB upload or its publish dispatch, both of which follow. (The
      # interpreter call above lands inside the same STAGE_STARTED_AT window,
      # so its cost shows in this rollup too — itemised by phase.)
      - name: Stage health (Sibyl)
        if: always()
        continue-on-error: true
        run: |
          set +e
          mkdir -p diagnostics
          # Pin on the sibyl_run_id THIS run printed. Taking the newest
          # sibyl_runs row instead would report the previous day's run whenever
          # Sibyl was gated out or died before persisting — verified against the
          # reference DB, where that fallback resolved the wrong run.
          SIBYL_RUN_ID=$(grep -oE 'sibyl_run_id=[A-Za-z0-9_]+' sibyl_stdout.txt 2>/dev/null \
            | tail -n 1 | cut -d= -f2 || true)
          HS_RUN_ID="${{ github.event.inputs.hs_run_id }}"
          if [ -n "${SIBYL_RUN_ID}" ] && [ -z "${HS_RUN_ID}" ]; then
            HS_RUN_ID=$(python - "${SIBYL_RUN_ID}" <<'EOF'
          import os
          import sys

          import duckdb

          db = os.environ["RESOLVER_DB_URL"]
          db = db[len("duckdb:///"):] if db.startswith("duckdb:///") else db
          try:
              con = duckdb.connect(db, read_only=True)
              row = con.execute(
                  "SELECT hs_run_id FROM sibyl_runs WHERE sibyl_run_id = ?", [sys.argv[1]]
              ).fetchone()
              print((row[0] if row else "") or "")
              con.close()
          except Exception:
              print("")
          EOF
          )
          fi
          echo "stage_health sibyl_run_id=${SIBYL_RUN_ID:-<none>} hs_run_id=${HS_RUN_ID:-<none>}"
          python -m scripts.ci.stage_health \
            --db "${RESOLVER_DB_URL}" \
            --stage sibyl \
            --hs-run-id "${HS_RUN_ID:-}" \
            --sibyl-run-id "${SIBYL_RUN_ID:-}" \
            --since "${STAGE_STARTED_AT:-}" \
            --out diagnostics/stage_health__sibyl.json
          exit 0

      - name: Upload stage diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: pythia-stage-diagnostics-sibyl
          path: |
            diagnostics/stage_health__sibyl.json
            sibyl_stdout.txt
          if-no-files-found: warn
          retention-days: 90

      - name: Upload canonical resolver DB
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pythia-resolver-db
          path: data/resolver.duckdb

      # This is the forecast pipeline's SOLE release trigger: HS Triage no longer
      # triggers publish directly (see publish_latest_data.yml), so publishing
      # runs here at the end of Sibyl. Dispatched on success even when Sibyl found
      # 0 eligible questions — the "Upload canonical resolver DB" step above still
      # uploads the (HS-produced) canonical DB, so the forecast cycle always
      # produces exactly one release. publish then inspects the published DB.
      - name: Publish post-Sibyl DB to release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run publish_latest_data.yml \
            -R "${{ github.repository }}" \
            --ref main \
            -f run_id=${{ github.run_id }}
