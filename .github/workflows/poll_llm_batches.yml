---
# Poll provider Batch-API jobs and advance the staged pipeline.
#
# Every 15 minutes: read the tiny pythia-batch-state artifacts uploaded by
# submit stages (never the DB), poll the pending provider batches, and when
# a pipeline's batches are all terminal (or past PYTHIA_BATCH_MAX_WAIT_H)
# dispatch its next Pythia Pipeline Stage. Convergent by design: a missed
# cron tick or crashed poller run only delays a pipeline, never loses it,
# and the collect stages are idempotent so a rare double-dispatch is
# harmless.
#
# Deliberately NOT in the pythia-resolver-db concurrency group — the poller
# never touches the DB, and sitting in that group would let a long stage
# run starve the polling cadence.

name: Poll LLM Batches

on:
  schedule:
    # Ignition only. GitHub throttles frequent schedules hard — in practice
    # this fires roughly hourly, not every 15 minutes, which parked staged
    # pipelines between stages for hours. Progress comes from the
    # self-rescheduling chain at the end of this job; the cron just starts it
    # (and backstops a chain that was broken by an infra failure).
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      chain_depth:
        description: "Self-dispatch chain depth (internal; leave empty for manual runs)"
        required: false
        default: ""
        type: string
      inspect_batches:
        description: "Diagnostic: space-separated OpenAI batch ids to dump in full (incl. the errors field). Skips polling."
        required: false
        default: ""
        type: string
      inspect_recent:
        description: "Diagnostic: also dump the N most recent OpenAI batches (e.g. 5). Skips polling."
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: write  # dispatches pythia_pipeline_stage.yml

concurrency:
  group: poll-llm-batches
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Checked out before the gate so the gate itself can be the shared,
      # unit-tested decision core rather than a second inline copy of it.
      # Checkout is ~2s; the expensive part the gate protects is the pip
      # install + provider polling below.
      - name: Check out code
        uses: actions/checkout@v4

      # Cheap activity gate: the pipeline is active only a few days per
      # month, but this cron fires year-round. scripts/ci/check_pipeline_active.py
      # answers "is a staged pipeline in flight?" with TWO conditions — a recent
      # pythia-batch-state artifact AND no newer successful fc_collect_finalize.
      #
      # This step used to inline only the first condition. Because the final
      # stage emits no batch state, its predecessor's artifact lingers for the
      # artifact retention window, so for ~72h after every pipeline finished
      # each tick paid a full checkout + pip install + provider poll only to
      # decide "already completed" for every pipeline (~70 wasted runs per
      # cycle). Sharing the script keeps this gate and the ingest gate from
      # drifting apart again.
      #
      # Manual dispatch always polls (recovery valve). Fails open to
      # active=true, so a broken gate delays nothing.
      - name: Check for active pipelines
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHIA_PIPELINE_ACTIVE_WINDOW_H: "72"
          FORCE: ${{ github.event_name == 'workflow_dispatch' }}
        # python3, not python: this runs BEFORE setup-python. The script is
        # stdlib + gh only, so no pip install is needed to reach a verdict.
        run: python3 -m scripts.ci.check_pipeline_active --emit active

      - name: Set up Python 3.11
        if: steps.gate.outputs.active == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Minimal deps on purpose: this runs every 15 minutes. The poller only
      # needs requests (provider batch polling) — pythia.llm_batch's other
      # imports are stdlib or lazy.
      - name: Install minimal dependencies
        if: steps.gate.outputs.active == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # Diagnostic escape hatch. A failed OpenAI batch is retained
      # provider-side, so its `errors` field can be read after the fact — but
      # only from somewhere holding the API key, which no local session does.
      # Read-only and free; skips polling so a diagnostic run cannot dispatch
      # a pipeline stage as a side effect.
      - name: Inspect OpenAI batches (diagnostic)
        id: inspect
        if: ${{ inputs.inspect_batches != '' || inputs.inspect_recent != '' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Passed as env rather than interpolated into the script body: these
          # are free-text dispatch inputs, and `${{ }}` inside a run block is a
          # shell-injection seam.
          INSPECT_BATCHES: ${{ inputs.inspect_batches }}
          INSPECT_RECENT: ${{ inputs.inspect_recent }}
        run: |
          set -e
          # Built as an array so the batch-id list word-splits deliberately
          # rather than by accident (shellcheck SC2086).
          args=()
          if [ -n "${INSPECT_BATCHES}" ]; then
            read -r -a ids <<< "${INSPECT_BATCHES}"
            args+=("${ids[@]}")
          fi
          if [ -n "${INSPECT_RECENT}" ]; then
            args+=(--recent "${INSPECT_RECENT}")
          fi
          python -m scripts.ci.inspect_openai_batch "${args[@]}" --input-head 2

      - name: Poll batches and dispatch ready stages
        id: poll
        if: ${{ steps.gate.outputs.active == 'true' && inputs.inspect_batches == '' && inputs.inspect_recent == '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          POLLER_CHAIN_DEPTH: ${{ inputs.chain_depth || '0' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHIA_BATCH_MAX_WAIT_H: "24"
        run: |
          set -e
          python -m scripts.ci.poll_llm_batches

      - name: Upload poller decisions
        if: always() && steps.gate.outputs.active == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pythia-poller-decisions
          path: diagnostics/poll_decision.json
          retention-days: 14
          if-no-files-found: warn

      # The self-rescheduling chain. `rearm` is true only while some pipeline
      # is genuinely in flight (waiting on batches, mid-stage, or just
      # dispatched) and under the chain cap — a completed or STALLED pipeline
      # never re-arms, so this cannot spin. The sleep paces the chain well
      # inside the job's 15-minute timeout.
      - name: Reschedule next poll
        if: steps.poll.outputs.rearm == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_DEPTH: ${{ steps.poll.outputs.chain_depth_next }}
        run: |
          set -e
          echo "Pipeline still in flight — chaining next poll (depth ${NEXT_DEPTH})."
          sleep 300
          gh workflow run poll_llm_batches.yml --ref main -f "chain_depth=${NEXT_DEPTH}"
