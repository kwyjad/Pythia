---
# Read-only evaluation spike: can Pythia consume the Montandon STAC API?
#
# Deliberately NOT in the pythia-resolver-db concurrency group — this reads the
# canonical DB and writes nothing back, so it must never queue behind (or block)
# a live pipeline stage.
name: Probe Montandon STAC

on:
  workflow_dispatch:
    inputs:
      endpoint:
        description: "Montandon STAC root (blank = production)"
        required: false
        default: ""
        type: string
      months_back:
        description: "Months of history to sample for coverage and latency"
        required: false
        default: "36"
        type: string
      hazards:
        description: "Comma-separated hazard codes for the coverage baseline"
        required: false
        default: "FL,DR,TC"
        type: string
      db_run_id:
        description: "Optional: force the canonical DB from a specific Actions run ID"
        required: false
        default: ""
        type: string
      auth_scheme:
        description: "How to present MONTANDON_TOKEN (the service's scheme is undocumented)"
        required: false
        default: "bearer"
        type: choice
        options: ["bearer", "token", "basic", "header"]

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests duckdb

      # The G3 coverage gate compares Montandon against what our IFRC ingest
      # already holds. Without the DB the probe reports the baseline as
      # unavailable rather than inventing one, so a download failure degrades
      # the report instead of failing the run.
      - name: Download canonical resolver DB
        id: db
        continue-on-error: true
        uses: ./.github/actions/download-canonical-db
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          force-run-id: ${{ inputs.db_run_id }}

      - name: Probe Montandon
        # Inputs go through the environment rather than being interpolated into
        # the script body, so a value containing shell metacharacters is data,
        # not code.
        env:
          PROBE_ENDPOINT: ${{ inputs.endpoint }}
          PROBE_MONTHS_BACK: ${{ inputs.months_back }}
          PROBE_HAZARDS: ${{ inputs.hazards }}
          PROBE_AUTH_SCHEME: ${{ inputs.auth_scheme }}
          # The live endpoints answer 401, so the probe needs a credential to
          # get past G0. This is a DIFFERENT secret from GO_API_TOKEN: the GO
          # operational API and the Montandon STAC API are separate services,
          # and a stored credential for one is not silently forwarded to the
          # other. Unset until IFRC grants access — the probe then reports
          # "BLOCKED — credentials required" rather than guessing.
          MONTANDON_TOKEN: ${{ secrets.MONTANDON_TOKEN }}
        run: |
          set -euo pipefail
          # An array, not a string: the optional flags carry their own values,
          # and relying on word-splitting to separate them is what shellcheck
          # (correctly) objects to.
          args=(
            --months-back "${PROBE_MONTHS_BACK}"
            --hazards "${PROBE_HAZARDS}"
            --auth-scheme "${PROBE_AUTH_SCHEME}"
            --out-dir diagnostics
            --verbose
          )
          if [ -f data/resolver.duckdb ]; then
            args+=(--db data/resolver.duckdb)
          else
            echo "::warning::No canonical DB available; the G3 coverage baseline will be reported as unavailable."
          fi
          if [ -n "${PROBE_ENDPOINT}" ]; then
            args+=(--endpoint "${PROBE_ENDPOINT}")
          fi
          python -m tools.probe_montandon_stac "${args[@]}"

      - name: Render the verdict into the step summary
        if: always()
        run: |
          if [ -f diagnostics/montandon_probe.md ]; then
            cat diagnostics/montandon_probe.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The probe produced no report — check the previous step's log." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload probe artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: montandon-probe
          path: |
            diagnostics/montandon_probe.json
            diagnostics/montandon_probe.md
          if-no-files-found: warn
          retention-days: 30
